<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="İlaç">
<meta name="theme-color" content="#FFEFF5">
<title>İlaç</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
/* Hallmark · macrostructure: yok — bu bir uygulama, sayfa değil.
 *   Damga bir tur boyunca "Workbench" diyordu; Workbench bir pazarlama sayfası
 *   iskeleti (ekran görüntüsü çerçeveleri, altyazılar, yapışkan "Try it free").
 *   Burada ne çerçeve var ne CTA. Hallmark'ın 21 iskeletinin hepsi sayfa şekli,
 *   hiçbiri uymuyor — başka bir ad yazmak ikinci bir yalan olurdu.
 * genre: playful · tone: soft
 * theme: custom (brand-preserved) · paper oklch(95% 0.03 350) · accent oklch(52% 0.16 359)
 * pre-emit critique: P5 H5 E5 S5 R4 V4
 *
 * Sevk edilen yapı:
 *   · 24 saatlik kadran — ekranın kahramanı; gece bandı (21:00→06:00) tek koyu
 *     kütle, parlaklık 0.107, kâğıda karşı 5.16:1
 *   · hap kadranın merkezinde, u_off ile her karede kadrana hizalanıyor
 *   · diyet: günün zaman çizelgesi — saat sol olukta, omurga, ilerleme noktası
 *   · token sistemleri: 9 tipografi · 4 yarıçap · 3+1 gölge · 8 boşluk ·
 *     2 kenarlık tonu · 3 basma ölçeği — stil sayfasında serbest px yok
 *   · hareket: yaylanma yalnız fiziksel olanda (sürüklenen panel, kaydırılan
 *     sekme göstergesi, sayfa geçişi); basma ve durum geçişi ease-out
 *   · birincil eylem dolu `--act` (beyaz etiketle 5.77:1) — gradyan ölçümde
 *     kaldı: açık ucunda 2.58:1
 */
:root{
  --bg:#FFEFF5;
  --plum:#5A2C46;
  /* metin için: .78 alfa ≈ 5.26:1 zemin üstünde (WCAG AA) */
  --soft:rgba(90,44,70,.78);
  /* yalnız çizgi/dolgu — metin değil */
  --faint:rgba(90,44,70,.12);
  /* Kenarlık: dört ayrı ton elle yazılıydı (.05/.08/.12/.28) ve aralarındaki
     fark görünmüyordu. İki rol: yapısal ince çizgi ve vurgulu kenar.
     `--cardline` ayrı kalıyor — o cam yüzeyin beyaz kenarı, başka malzeme. */
  --line:rgba(90,44,70,.09);
  --line-strong:rgba(90,44,70,.26);
  --rose:#F08AAE;
  --rose2:#FFB3CD;
  /* rose metin/odak için çok açık (2.1:1) — koyu eşi 5.2:1 */
  --rose-ink:#B03A63;
  --rose-mid:#DA5A85;
  --amber-ink:#9A5416;
  --mint:#8FD0B4;
  /* gece kuşağı ekranın tek koyu kütlesi: %11 opaklıkta görünmezdi ve
     yüzeylerin hepsi 0.58-0.90 parlaklık bandında sıkışıyordu */
  --night:rgba(74,52,104,.82);
  --night-ink:rgba(255,255,255,.72);
  /* Yüzey kuralı: cam yalnız canlı canvas'ın üstündeki kromda (üst şerit
     düğmeleri, sekme grubu, gün-bitti rozetleri). İçerik yüzeyleri ve panel
     içindeki kontroller dolu beyaz — opak zemin üstünde cam anlamsız. */
  /* Saf `#fff` yüzey anti-pattern kataloğunda kritik: düz ve sentetik okunuyor.
     Panel zemini (#FFF6FA) zaten tonluydu, kartlar onun üstünde ondan daha
     soğuk kalıyordu. Tek kart tonu, pembeye doğru ısıtılmış. */
  --paper-card:#FEF7FA;
  --card:rgba(255,255,255,.62);
  --cardline:rgba(255,255,255,.9);
  /* hareket sistemi — 4 eğri, 6 süre. Daha önce 15 ayrı eğri vardı,
     her eleman kendi fiziğine göre hareket ettiği için uyumsuz duruyordu. */
  --ease-out:cubic-bezier(.22,1,.36,1);
  /* Yaylanma yalnız gerçekten fiziksel olanda: sürüklenen panel, kaydırılan
     sekme göstergesi, kaydırmayla gelen sayfa. Basma ve durum geçişi ease-out —
     bir düğmeye basınca ölçeğin geri sekmesi fiziksel bir olay değil. */
  --ease-spring:cubic-bezier(.34,1.46,.64,1);
  --ease-both:cubic-bezier(.65,0,.35,1);
  --ease-draw:cubic-bezier(.3,.75,.3,1);
  --d1:140ms; --d2:240ms; --d3:380ms; --d4:560ms; --d5:880ms; --d6:1200ms;
  /* Tip ölçeği: 22 ayrı boyut vardı, 12-17px arasında 11 tanesi. Yarım piksel
     farklar hiyerarşi kurmuyordu. Yedi basamak + üç display boyu. 16px alt sınır
     input'larda korunuyor (altında iOS odaklanınca sayfayı yakınlaştırıyor). */
  --fs-1:11px;    /* mikro: efsane, gün adı, çubuk yüzdesi */
  --fs-2:12.5px;  /* ikincil: tarih, sayaç, bölüm başlığı */
  --fs-3:14px;    /* arayüz metni */
  --fs-4:16px;    /* gövde, input, birincil eylem */
  --fs-5:20px;    /* sayı göstergeleri */
  --fs-6:26px;    /* iri kontrol */
  --fs-d:34px;    /* display: açılış başlığı, su hedefi */
  --fs-name:clamp(30px,9.5vw,42px);
  --fs-dttl:clamp(26px,8.2vw,34px);
  /* Köşe: 14 ayrı yarıçap vardı; 11px ile 13px arasındaki fark görünmüyor ama
     iki ayrı karar olarak yaşıyordu. Dört basamak + iki anlamsal değer. */
  --r-1:10px;   /* çubuk, minik kolon */
  --r-2:16px;   /* form kontrolü, düğme, satır */
  --r-3:22px;   /* kart */
  --r-4:32px;   /* panel */
  /* Gölge: 13 ayrı elevation vardı; `0 5px 16px .05` ile `0 6px 18px .05`
     arasındaki fark ölçülebiliyor ama görülemiyordu. */
  --e1:0 6px 18px rgba(90,44,70,.06);    /* yüzey */
  --e2:0 13px 32px rgba(90,44,70,.17);   /* kalkık: bildirim, ipucu */
  --e3:0 10px 26px rgba(176,58,99,.3);   /* birincil eylem */
  --e-sheet:0 -18px 50px rgba(90,44,70,.15);
  /* Birincil eylemin dolgusu. Gradyandı; ölçüm gradyanın beyaz etiketi
     taşıyamadığını gösterdi: açık uçta kontrast 2.58:1, etiketin oturduğu
     ortada ~3.5:1 — 16px kalın metin "büyük metin" saymıyor, 4.5:1 gerekiyor.
     Açık ucu AA'ya çekmek gradyanı zaten dolu renk kadar koyu yapıyordu,
     yani gradyanın tek gerekçesi (gece bandına tabi kalması) ortadan kalktı. */
  --act:var(--rose-ink);
  /* Boşluk: 21 serbest px değeri vardı (1px'den 26px'e), tek token `--pad`di.
     4px ızgarası + tek bir 2px mikro adım. */
  --s0:2px; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px;
  --pad:24px;
  --hit:44px;
  /* Basma geri bildirimi: 15 ayrı ölçek değeri vardı (.85'ten .985'e).
     Üç rol yeter — küçük kontrol daha çok, büyük yüzey daha az çöker. */
  --press-sm:.90;   /* ikon düğmesi, daire, sekme */
  --press:.94;      /* standart düğme */
  --press-lg:.97;   /* birincil pil, liste satırı */
  /* fare girdisi için tek ton */
  --hov:rgba(176,58,99,.07);
  --hov-line:rgba(176,58,99,.24);
  /* telefon için tasarlandı; geniş ekranda gerilmek yerine sütun kalır */
  --shell:460px;
}
@media (max-width:360px){:root{--pad:var(--s5)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow-y:hidden;overflow-x:clip}
body{background:var(--bg);color:var(--plum);font-family:"DM Sans",-apple-system,system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
/* içerik metni seçilebilir kalsın — yedek/not kopyalamak için */
.name,.sub,.note,.row .txt,.meal,.empty,input,textarea{-webkit-user-select:text;user-select:text}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

.app{position:relative;z-index:1;height:100%;width:100%;max-width:var(--shell);margin-inline:auto;
  display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + var(--s5)) var(--pad) calc(env(safe-area-inset-bottom) + var(--s6))}

/* üst şerit — saat/tarih istiflenir, 320px'de taşmaz */
.top{display:flex;align-items:center;gap:var(--s3);min-width:0}
.stamp{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.clock{font-size:var(--fs-4);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1.15}
.date{font-size:var(--fs-2);color:var(--soft);white-space:nowrap}
/* ilerleme artık doz bağlamının yanında — üst şeritte değil */
.count{font-size:var(--fs-2);color:var(--soft);font-variant-numeric:tabular-nums;
  display:block;margin:0 0 var(--s3);letter-spacing:.01em}
.count:empty{display:none}
.bell{width:var(--hit);height:var(--hit);flex:0 0 auto;border-radius:50%;border:1px solid var(--cardline);background:var(--card);
  display:grid;place-items:center;transition:transform var(--d1)}
.bell:active{transform:scale(var(--press-sm))}

/* kadran */
/* kadran %45'e çivilenmişti: 1280x800'de foot onun üstüne 18px biniyordu.
   Artık foot'tan artan alanı kaplıyor ve o alana sığacak kadar küçülüyor. */
.ring{position:relative;flex:1 1 auto;min-height:0;display:grid;padding-block:var(--s2);
  pointer-events:none;transition:opacity var(--d3) ease}
/* kutuyu doldurur, viewBox içeriği kendi oranında ortalar: dar ekranda
   genişlik, basık ekranda yükseklik sınırlar — ikisi de taşmaz */
.ring svg{width:100%;height:100%;min-height:0;max-width:min(86vw,346px);justify-self:center;
  overflow:visible;pointer-events:auto}
.night{fill:none;stroke:var(--night);stroke-width:18}
.track{fill:none;stroke:rgba(90,44,70,.1);stroke-width:1}
.elapsed{fill:none;stroke:rgba(240,138,174,.6);stroke-width:2.4;stroke-linecap:round}
.hlab{font-size:10.5px;font-weight:600;fill:rgba(90,44,70,.72);letter-spacing:.06em}
.dlab{font-size:11px;font-weight:700;fill:#5A2C46;letter-spacing:.02em}
.hand{stroke:var(--rose);stroke-width:1.8;stroke-linecap:round}
.handdot{fill:var(--rose)}
.bead{transition:r var(--d3) var(--ease-out),fill var(--d3) ease,opacity var(--d3) ease,stroke-width var(--d3) ease}
.late{animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{r:7;opacity:.5}70%,100%{r:15;opacity:0}}
.tap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(50vw,200px);height:min(50vw,200px);border:0;background:none;border-radius:50%;
  z-index:2;pointer-events:auto}

/* Gün bitti ekranı. Daha önce bu kurallar `.done` sınıfıyla yazılıydı, ama
   tamamlanmış öğün kartı da `.meal.done` taşıyor: `.done{display:none}`
   bitirilen öğünleri diyet listesinden tamamen siliyordu. Artık kimliğe
   bağlı, çakışma yok. */
#done{display:none;flex:1;min-height:0;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:0 var(--s2)}
.page.is-done #done{display:flex}
/* akışa girdiği için gizlemek yetmiyor; alanı .done'a bırakmalı */
.page.is-done .ring{display:none}
.page.is-done .name,.page.is-done .sub,.page.is-done .note,
.page.is-done .count,.page.is-done .bar{display:none}
.page.is-done .bar2{margin-top:0}
.dmark{width:118px;height:118px;margin-bottom:var(--s5)}
.dmark svg{width:100%;height:100%;display:block}
.dm-t{fill:none;stroke:rgba(90,44,70,.10);stroke-width:5}
.dm-f{fill:none;stroke:var(--mint);stroke-width:5;stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:327}
.dm-c{fill:none;stroke:var(--mint);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:66;stroke-dashoffset:66}
#done.in .dm-f{animation:dmDraw var(--d5) var(--ease-draw) .1s forwards}
#done.in .dm-c{animation:dmDraw var(--d3) var(--ease-draw) .8s forwards}
@keyframes dmDraw{to{stroke-dashoffset:0}}
.dttl{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:var(--fs-dttl);
  line-height:1.1;margin:0;letter-spacing:-.5px;overflow-wrap:anywhere}
.dsub{margin:var(--s3) 0 0;font-size:var(--fs-3);color:var(--soft)}
.dstats{display:flex;gap:var(--s3);margin-top:var(--s5);flex-wrap:wrap;justify-content:center}
.dstats span{background:var(--card);border:1px solid var(--cardline);border-radius:var(--r-2);padding:var(--s3) var(--s4);
  font-size:var(--fs-1);color:var(--soft);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.dstats b{display:block;margin-bottom:var(--s0);font-size:var(--fs-5);font-weight:700;color:var(--plum);
  font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.dnext{margin:var(--s5) 0 0;font-size:var(--fs-3);color:var(--soft)}
.dnext b{color:var(--rose-ink);font-weight:700;font-variant-numeric:tabular-nums}
#done.in .dttl{animation:fadeUp var(--d4) var(--ease-out) .5s both}
#done.in .dsub{animation:fadeUp var(--d4) var(--ease-out) .62s both}
#done.in .dstats{animation:fadeUp var(--d4) var(--ease-out) .76s both}
#done.in .dnext{animation:fadeUp var(--d4) var(--ease-out) .9s both}

/* alt blok */
.foot{margin-top:auto;transition:opacity var(--d2),transform var(--d2)}
.foot{will-change:transform,opacity}
.foot.swap{opacity:0;transform:translateY(12px) scale(.985)}
/* düz (roman) — eğik serif başlık hem okunurluğu düşürüyordu hem de bir yapay-zekâ klişesi */
.name{font-family:Fraunces,Georgia,serif;font-style:normal;font-weight:600;font-size:var(--fs-name);
  line-height:1.05;margin:0;letter-spacing:-.5px;overflow-wrap:anywhere;min-width:0}
.sub{margin:var(--s3) 0 0;display:flex;align-items:baseline;gap:var(--s3);font-size:var(--fs-3);color:var(--soft);flex-wrap:wrap}
.sub b{font-size:var(--fs-5);font-weight:700;color:var(--rose-ink);font-variant-numeric:tabular-nums}

/* eylem çubuğu — birincil eylemin artık adı var */
.bar{display:flex;gap:var(--s3);margin-top:var(--s5);align-items:center}
.bar2{display:flex;gap:var(--s3);margin-top:var(--s3)}
/* birincil: "Aldım" — daha önce kadranın üstünde görünmez bir dairedeydi */
.take{flex:1 1 auto;min-width:0;height:54px;border:0;border-radius:999px;display:flex;align-items:center;
  justify-content:center;gap:var(--s2);padding:0 var(--s5);font-family:inherit;font-size:var(--fs-4);font-weight:700;color:#fff;
  background:var(--act);box-shadow:var(--e3);
  white-space:nowrap;transition:transform var(--d1) var(--ease-out)}
.take:active{transform:scale(var(--press-lg))}
.take:disabled{opacity:.34;box-shadow:none}
/* ikincil: metin etiketli — daha önce yalnız ikondu */
.lbl{flex:1 1 0;min-width:0;height:44px;border-radius:var(--r-2);border:1px solid var(--cardline);background:var(--card);
  display:flex;align-items:center;justify-content:center;gap:var(--s2);font-family:inherit;font-size:var(--fs-3);
  font-weight:500;color:var(--plum);white-space:nowrap;transition:transform var(--d1) var(--ease-out)}
.lbl:active{transform:scale(var(--press))}
.lbl svg{flex:0 0 auto}
.lbl.skip{flex:0 0 auto;height:54px;padding:0 var(--s5);border-radius:999px;font-weight:700;color:var(--soft)}
/* Diyet sekmesinin düğmesi "öğün ekle" — günlük bir iş değil, kurulum işi;
   ilaç sekmesindeki "Aldım" ile aynı görünmesi hiyerarşiyi yanlış kuruyordu.
   Birincil dolgu tek bir eyleme ayrıldı: günün asıl işi olan doz almaya. */
.add{flex:1 1 auto;min-width:0;height:var(--hit);border-radius:999px;
  border:1px solid var(--cardline);background:var(--card);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:center;gap:var(--s2);
  font-family:inherit;font-size:var(--fs-3);font-weight:700;color:var(--rose-ink);
  transition:transform var(--d1) var(--ease-out)}
.add:active{transform:scale(var(--press))}
.add svg{flex:0 0 auto}

/* bildirim — üst şeridin altına iner; eskiden ekranın dibindeydi ve
   az önce kullandığın eylem düğmelerinin üstünü kapatıyordu */
.toast{position:fixed;left:14px;right:14px;max-width:calc(var(--shell) - 28px);margin-inline:auto;
  top:calc(env(safe-area-inset-top) + 76px);z-index:9;
  display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s3) var(--s3) var(--s3);border-radius:var(--r-2);background:var(--paper-card);
  border:1px solid var(--cardline);box-shadow:var(--e2);
  font-size:var(--fs-3);font-weight:500;overflow:hidden;
  transform:translateY(calc(-100% - 96px));transition:transform var(--d3) var(--ease-both)}
.toast.on{transform:translateY(0);transition:transform var(--d4) var(--ease-out)}
.ticon{width:27px;height:27px;flex:0 0 auto;border-radius:50%;background:rgba(143,208,180,.26);
  display:grid;place-items:center}
#toastMsg{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.3}
.toast button{flex:0 0 auto;border:0;background:rgba(176,58,99,.1);color:var(--rose-ink);
  font-family:inherit;font-size:var(--fs-3);font-weight:700;padding:0 var(--s4);min-height:var(--hit);border-radius:999px;
  display:inline-flex;align-items:center;gap:var(--s2);transition:transform var(--d1)}
.toast button:active{transform:scale(var(--press))}
/* Geri alma penceresinin ne kadar kaldığını gösterir. Süresi JS'ten geliyor:
   hareket sistemini kurarken bu çubuğu `--d6`ya (1200ms) bağlamıştım, ama bu
   dekoratif bir hareket değil, 5 saniyelik bir sayaç — çubuk pencere dolmadan
   3.8 saniye önce boşalıyor ve "kaçırdım" izlenimi veriyordu. Tek kaynak: UNDO. */
.tbar{position:absolute;left:0;bottom:0;height:2.5px;width:100%;background:var(--rose2);transform-origin:left}
.tbar.run{animation:tcount var(--d6) linear forwards}  /* süre JS'te UNDO ile ezilir */
@keyframes tcount{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* sheet */
.scrim{position:fixed;inset:0;z-index:5;background:rgba(90,44,70,.28);backdrop-filter:blur(7px);
  opacity:0;pointer-events:none;transition:opacity var(--d2) var(--ease-out)}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:var(--shell);margin-inline:auto;
  z-index:6;background:#FFF6FA;border-radius:var(--r-4) var(--r-4) 0 0;
  padding:var(--s3) var(--s6) calc(env(safe-area-inset-bottom) + var(--s6));box-shadow:var(--e-sheet);
  transform:translateY(110%);transition:transform var(--d3) var(--ease-both);max-height:88vh;overflow-y:auto;will-change:transform}
.sheet.open{transform:translateY(0);transition:transform var(--d4) var(--ease-spring)}  /* fiziksel: sürüklenip bırakılıyor */
.grab{width:38px;height:4px;border-radius:999px;background:var(--faint);margin:var(--s1) auto var(--s5)}
.field{display:flex;gap:var(--s3);margin-bottom:var(--s3)}
input[type=text],input[type=time]{flex:1;width:100%;font-family:inherit;font-size:var(--fs-4);font-weight:500;color:var(--plum);
  background:var(--paper-card);border:1.5px solid var(--line);border-radius:var(--r-2);padding:var(--s4) var(--s4);outline:none}
input:focus{border-color:var(--rose2)}
input::placeholder{color:rgba(90,44,70,.3)}
.mini{width:52px;min-height:var(--hit);flex:0 0 auto;border-radius:var(--r-2);border:0;background:var(--rose-ink);display:grid;place-items:center}
.mini:active{transform:scale(var(--press-sm))}
.picks{display:flex;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4)}
.pick{width:38px;height:38px;border-radius:50%;border:2px solid transparent;
  transition:border-color var(--d2) var(--ease-out),transform var(--d2) var(--ease-out)}
.pick.sel{border-color:var(--plum);transform:scale(1.12)}
.shape{width:56px;height:48px;border-radius:var(--r-2);border:1.5px solid var(--line);background:var(--paper-card);display:grid;place-items:center}
.shape.sel{border-color:var(--plum);border-width:2px}
.days{display:flex;gap:var(--s2);margin-bottom:var(--s5)}
.days button{flex:1;min-width:0;height:var(--hit);border-radius:var(--r-2);border:1.5px solid var(--line);background:var(--paper-card);
  font-family:inherit;font-size:var(--fs-3);font-weight:700;color:var(--soft);
  transition:background-color var(--d2) var(--ease-out),border-color var(--d2) var(--ease-out),
    color var(--d2) var(--ease-out)}
/* beyaz-üstü-açık-pembe 1.7:1 idi — mürekkep rengi 6.7:1 */
.days button.on{background:var(--rose2);border-color:var(--rose-ink);color:var(--plum)}
.days button:active{transform:scale(var(--press-sm))}
.times{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s5)}
.chip{display:flex;align-items:center;gap:var(--s2);background:var(--paper-card);border:1.5px solid var(--line);
  border-radius:var(--r-2);padding:var(--s2) var(--s3) var(--s2) var(--s3);font-size:var(--fs-3);font-weight:500;font-variant-numeric:tabular-nums}
.chip button{border:0;background:none;padding:0;display:grid;place-items:center}
/* beyaz-üstü-açık-pembe 2.4:1 idi — mürekkep ucu 5.8:1 */
.save{width:100%;border:0;border-radius:999px;padding:var(--s5);font-family:inherit;font-size:var(--fs-4);font-weight:700;color:#fff;
  background:var(--act);transition:transform var(--d1)}
.save:active{transform:scale(var(--press-lg))}
.save:disabled{opacity:.3}
.row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3);border-radius:var(--r-2);background:var(--paper-card);margin-bottom:var(--s3);
  border:1.5px solid var(--line);transition:transform var(--d1) var(--ease-out),box-shadow var(--d2)}
.row:active{transform:scale(var(--press-lg));box-shadow:var(--e1)}
.row .txt{flex:1;min-width:0}
.row b{display:block;font-size:var(--fs-4);font-weight:500;overflow-wrap:anywhere}
.row small{color:var(--soft);font-size:var(--fs-2);font-variant-numeric:tabular-nums;letter-spacing:.05em}
.empty{text-align:center;color:var(--soft);font-size:var(--fs-3);padding:var(--s6) 0 var(--s4)}
/* haftalık grafik: alınan altta, atlanan üstünde — bugün çerçeveli */
.week{display:flex;gap:var(--s2);margin-bottom:var(--s2);align-items:flex-end}
.week .wk{flex:1;min-width:0;display:block;padding:0;border:0;background:none;font-family:inherit;text-align:center}
.week .wk:active{transform:scale(var(--press))}
.week .col{height:66px;border-radius:var(--r-1);background:rgba(90,44,70,.07);position:relative;overflow:hidden;
  margin-bottom:var(--s2);display:flex;flex-direction:column;justify-content:flex-end;
  transition:box-shadow var(--d2)}
.week .fill,.week .sfill{position:absolute;left:0;right:0;bottom:0;height:100%;
  transform:scaleY(0);transform-origin:bottom;transition:transform var(--d4) var(--ease-out)}
.week .fill{background:linear-gradient(180deg,var(--rose2),var(--rose))}
.week .sfill{background:rgba(90,44,70,.16)}
.week .pc{position:absolute;left:0;right:0;top:5px;font-size:var(--fs-1);font-weight:700;color:var(--soft);
  font-variant-numeric:tabular-nums}
.week .wk.today .col{box-shadow:inset 0 0 0 2px var(--rose-mid)}
.week .wk.today .dl{color:var(--rose-ink);font-weight:700}
.week .wk.sel .col{box-shadow:inset 0 0 0 3px var(--plum)}
.week .wk.sel .dl{color:var(--plum);font-weight:700}
.week .dl{display:block;font-size:var(--fs-1);color:var(--soft)}
/* geçmiş düzenleme satırı */
.hrow{width:100%;border:0;font-family:inherit;text-align:left}
.chk{width:30px;height:30px;flex:0 0 auto;margin-left:auto;border-radius:50%;
  border:2px solid var(--faint);display:grid;place-items:center;
  transition:background var(--d2),border-color var(--d2)}
.row.on{border-color:var(--rose2)}
.row.on .chk{background:var(--rose-ink);border-color:transparent}
.lnk{border:0;background:none;font-family:inherit;font-size:var(--fs-2);font-weight:700;color:var(--rose-ink);
  min-height:var(--hit);padding:0 var(--s1);display:inline-flex;align-items:center}
.empty em{display:block;margin-top:var(--s2);font-style:normal;font-size:var(--fs-2);opacity:.75}
.eico{display:block;margin:0 auto var(--s3);opacity:.45}
/* üst şerit: uyum · seri · ilaç sayısı */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);margin:var(--s0) 0 var(--s5)}
.st{background:var(--paper-card);border:1.5px solid var(--line);border-radius:var(--r-2);padding:var(--s3) var(--s2);text-align:center;
  box-shadow:var(--e1)}
.st b{display:block;font-size:var(--fs-5);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.1}
.st.k b{color:var(--rose-ink)}
.st span{display:block;margin-top:var(--s1);font-size:var(--fs-1);color:var(--soft)}
/* ilaç başına son 7 gün */
.dots7{display:flex;gap:var(--s1);margin-top:var(--s2)}
.dots7 i{width:9px;height:9px;border-radius:50%;flex:0 0 auto;box-sizing:border-box}
.dots7 i.f{background:var(--rose-mid)}
.dots7 i.h{background:var(--rose2)}
.dots7 i.e{border:1.5px solid var(--line-strong)}
.dots7 i.n{height:2px;border-radius:999px;background:rgba(90,44,70,.16);align-self:center}
.hdrow span.lgd{display:inline-flex;align-items:center;gap:var(--s1);
  font-size:var(--fs-1);color:var(--soft);font-weight:500}
.lgd i{flex:0 0 auto;display:inline-block}
.lgd i.m{width:6px;height:11px;border-radius:999px;background:var(--rose)}
.lgd i.w{width:9px;height:9px;border-radius:50%;background:#7FB8E0}
.lgd em{font-style:normal;margin-right:var(--s2)}
/* nokta göstergesinin karşılığı */
.lgnd{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);margin:var(--s4) var(--s0) var(--s0);font-size:var(--fs-1);color:var(--soft)}
.lgnd em{font-style:normal;display:inline-flex;align-items:center;gap:var(--s2)}
.lgnd i{width:9px;height:9px;border-radius:50%;box-sizing:border-box;flex:0 0 auto}
.lgnd i.f{background:var(--rose-mid)}
.lgnd i.h{background:var(--rose2)}
.lgnd i.e{border:1.5px solid var(--line-strong)}
.lgnd i.n{height:2px;border-radius:999px;background:rgba(90,44,70,.16)}
/* form bölüm başlıkları */
.hd.t{margin-top:var(--s5)}
/* ayar satırındaki durum simgesi */
.sic{width:34px;height:34px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  background:rgba(90,44,70,.07);transition:background var(--d3) ease}
#bell.on .sic{background:rgba(240,138,174,.22)}
/* su hedefi seçici */
.goal{display:flex;align-items:center;justify-content:center;gap:var(--s5);margin:var(--s1) 0 var(--s5)}
.gbtn{width:56px;height:56px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--line);background:var(--paper-card);
  font-family:inherit;font-size:var(--fs-6);font-weight:500;color:var(--plum);line-height:1;
  display:grid;place-items:center;box-shadow:var(--e1);
  transition:transform var(--d1) var(--ease-out)}
.gbtn:active{transform:scale(var(--press-sm))}
.gbtn:disabled{opacity:.28;box-shadow:none}
.gnum{text-align:center;min-width:88px}
.gnum b{display:block;font-size:var(--fs-d);font-weight:700;line-height:1;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.gnum em{display:block;margin-top:var(--s1);font-style:normal;font-size:var(--fs-2);color:var(--soft)}
.gprev{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s2);margin-bottom:var(--s4);min-height:19px}
.ghint{margin:0;text-align:center;font-size:var(--fs-2);color:var(--soft);line-height:1.45}
/* diyet haftalık geçmiş: çubuk öğün oranı, altındaki nokta su hedefi */
.dwh{margin-bottom:var(--s2)}
.dweek{display:flex;gap:var(--s2);margin-bottom:var(--s4)}
.dw{flex:1;min-width:0;text-align:center}
/* Önce her gün için yan yana iki ince çubuk vardı (öğün ve su) ve hangisinin
   hangisi olduğu yalnız başlıktaki "sol: öğün · sağ: su" ipucundan anlaşılıyordu.
   Artık öğün tek ve geniş bir çubuk, su ise gün adının altındaki dolan bir
   nokta: iki rakip yerine bir ana ölçü, bir yan ölçü. */
.dw .col{height:48px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:var(--s2);
  border-radius:var(--r-1);padding:var(--s1) var(--s0)}
.dw .bar{width:100%;max-width:18px;height:100%;border-radius:var(--r-1);background:rgba(90,44,70,.09);
  overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.dw .f{width:100%;height:100%;border-radius:var(--r-1);transform:scaleY(0);transform-origin:bottom;
  transition:transform var(--d4) var(--ease-out)}
.dw .f.m{background:linear-gradient(180deg,var(--rose2),var(--rose))}
.dw .dl{display:block;font-size:var(--fs-1);color:var(--soft)}
.dw .wd{display:block;width:9px;height:9px;margin:var(--s1) auto 0;border-radius:50%;
  border:1.5px solid rgba(127,184,224,.6);box-sizing:border-box;
  background:linear-gradient(to top,#7FB8E0 calc(var(--wf,0) * 100%),transparent 0);
  transition:background var(--d4) var(--ease-out)}
.dw.today .bar{box-shadow:inset 0 0 0 2px var(--rose-mid)}
.dw.today .dl{color:var(--rose-ink);font-weight:700}
.times:empty{display:none}
.hd{font-size:var(--fs-2);font-weight:700;color:var(--soft);margin:0 0 var(--s3);letter-spacing:.02em}

/* açılış — kalp WebGL'de gerçek 3B olarak çiziliyor (ışın izleme, kırılma,
   iç tonlama). Bu katman saydam; yalnız uygulama adını taşır. */
#boot{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;padding-bottom:24vh;pointer-events:none;
  transition:opacity var(--d4) var(--ease-both)}
#boot.gone{opacity:0}
.btitle{display:flex;gap:var(--s0);font-family:Fraunces,Georgia,serif;font-weight:600;font-size:var(--fs-d);
  letter-spacing:-.5px;color:var(--plum);
  transition:transform var(--d4) var(--ease-both),opacity var(--d3) ease}
#boot.gone .btitle{transform:translateY(16px);opacity:0}
.btitle i{font-style:normal;opacity:0}
#boot.play .btitle i{animation:btIn var(--d3) var(--ease-out) both}
@keyframes btIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* perde artık saydam olduğu için uygulamayı ayrıca gizlemek gerekiyor */
.app{opacity:0}
body.ready .app{opacity:1}   /* kendi solması kadranın açılışıyla yarışıyordu */

/* giriş hareketleri */
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.2)}65%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:792}to{stroke-dashoffset:0}}
@keyframes ripple{0%{transform:scale(.86);opacity:.9}100%{transform:scale(1.28);opacity:0}}
@keyframes leave{to{opacity:0;transform:scale(.97) translateY(12px)}}
.reveal-top{animation:fadeDown var(--d4) var(--ease-out) both}
.reveal-foot{animation:fadeUp var(--d5) var(--ease-out) both}
.track.draw{stroke-dasharray:792;animation:draw var(--d6) var(--ease-out) both}
circle.bead,text.dlab{transform-box:fill-box;transform-origin:center}
.app.leaving{animation:leave var(--d3) ease forwards}

/* sayfalar */
.pagewrap{position:relative;flex:1;min-height:0;margin-top:var(--s4)}
/* geçiş: giden sayfa geri çekilip bulanıklaşır, gelen sayfa yaylanarak oturur */
.page{position:absolute;inset:0;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transform:translateX(var(--x,14%)) scale(.92);
  will-change:transform,opacity;
  transition:opacity var(--d2) ease,transform var(--d4) var(--ease-out)}
.page.on{opacity:1;transform:none;pointer-events:auto;
  transition:opacity var(--d3) ease,transform var(--d4) var(--ease-spring)}
.tabs{position:relative;display:flex;gap:var(--s0);padding:var(--s1);border-radius:999px;background:var(--card);border:1px solid var(--cardline);flex:0 0 auto}
.tabs .ind{position:absolute;top:3px;left:3px;width:44px;height:44px;border-radius:999px;background:var(--paper-card);
  box-shadow:var(--e1);transition:transform var(--d3) var(--ease-spring)}
.tabs button{position:relative;z-index:1;width:44px;height:44px;border:0;border-radius:999px;background:none;
  display:grid;place-items:center;opacity:.55;transition:opacity var(--d2) ease,transform var(--d2) var(--ease-out)}
.tabs button.on{opacity:1}
.tabs button:active{transform:scale(var(--press-sm))}
.tabs button.on svg{animation:tabPop var(--d4) var(--ease-out)}
/* dönme sallanmaydı — katalogdaki "icons that wobble" tell'i. Ölçek onayı kalıyor. */
@keyframes tabPop{0%{transform:scale(.78)}58%{transform:scale(1.1)}100%{transform:none}}
.dsum{animation:fadeUp var(--d4) var(--ease-out) both}

/* diyet — günün özeti iki kartta: öğün halkası ve dolan bardak */
.dsum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s3);margin-bottom:var(--s4)}
.card{background:var(--paper-card);border:1.5px solid var(--line);border-radius:var(--r-3);padding:var(--s3);
  box-shadow:var(--e1);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:var(--s2);min-width:0}
.cl{margin:0;font-size:var(--fs-2);font-weight:500;color:var(--soft);letter-spacing:.04em}
/* İki özet kartı farklı ritim konuşuyordu: halkanın sayısı halkanın içinde,
   bardağınki altındaydı — biri iki satır, öteki üç. Artık ikisi de
   [işaret] / [sayı] / [etiket]. Halka saf bir gösterge oldu, işaretler biraz
   küçüldü ki sayı aşağı inince kart büyümesin. */
.rgwrap{position:relative;width:62px;height:62px}
.rg{width:100%;height:100%;display:block}
.rg-t{fill:none;stroke:rgba(90,44,70,.10);stroke-width:8}
.rg-f{fill:none;stroke:var(--rose-mid);stroke-width:8;stroke-linecap:round;
  transition:stroke-dasharray var(--d5) var(--ease-out)}
.rg-n{text-align:center;line-height:1;
  font-size:var(--fs-5);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.rg-n em{font-style:normal;font-size:var(--fs-2);font-weight:500;color:var(--soft)}
/* bardak: dokun, dolsun — 16 küçük ikon yerine tek büyük hedef */
.wgwrap{position:relative;width:112px;height:62px;display:grid;place-items:center}
.wg{width:40px;height:54px;display:block}
.wv{transition:transform var(--d5) var(--ease-out)}
.w1,.w2{transform-box:view-box}
.w1{fill:#AFD6F0;animation:wave 3.4s linear infinite}
.w2{fill:#7FB8E0;opacity:.5;animation:wave 2.2s linear infinite reverse}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-48px)}}
.wtap{position:absolute;inset:0;border:0;background:none;border-radius:var(--r-2);transition:transform var(--d1) var(--ease-out)}
.wtap:active{transform:scale(var(--press-sm))}
.wmin{position:absolute;right:0;bottom:0;z-index:2;width:38px;height:38px;border-radius:50%;
  /* görsel 38px kalsın, dokunma alanı 44px olsun */
  border:1.5px solid var(--line);background:var(--paper-card);box-shadow:var(--e1);
  display:grid;place-items:center;transition:transform var(--d1)}
.wmin::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:var(--hit);height:var(--hit);border-radius:50%}
.wmin:active{transform:scale(var(--press-sm))}
.wmin[hidden]{visibility:hidden;display:grid}
.hint{margin-left:auto;align-self:center;font-size:var(--fs-2);font-weight:700;color:var(--rose-ink);white-space:nowrap}
.meals{flex:1;min-height:0;overflow-y:auto;padding-right:var(--s0);padding-top:var(--s0);scrollbar-width:none;
  -webkit-mask-image:linear-gradient(180deg,#000 90%,transparent);
  mask-image:linear-gradient(180deg,#000 90%,transparent)}
.meals::-webkit-scrollbar{display:none}
textarea{width:100%;font-family:inherit;font-size:var(--fs-4);font-weight:500;color:var(--plum);line-height:1.5;
  background:var(--paper-card);border:1.5px solid var(--line);border-radius:var(--r-2);padding:var(--s4) var(--s4);outline:none;
  min-height:110px;resize:none;margin-bottom:var(--s3)}
textarea:focus{border-color:var(--rose2)}
.del{width:100%;border:0;border-radius:999px;padding:var(--s4);margin-top:var(--s3);font-family:inherit;font-size:var(--fs-3);
  font-weight:700;color:var(--rose-ink);background:rgba(176,58,99,.12)}

/* Öğünler bir günün sırası, aynı kutudan yedi tane değil. Saat sol oluğa taşındı
   ve display yazı tipiyle kuruldu; kartları bir omurga bağlıyor, her öğünün
   noktası kendi ilerlemesini taşıyor. İçerik gerçekten sıralı olduğu için zaman
   çizelgesi burada süs değil, doğru yapısal araç. */
.meal{display:grid;grid-template-columns:58px minmax(0,1fr);margin-bottom:var(--s3);
  transition:opacity var(--d3) ease}
.mt{position:relative;padding:var(--s5) var(--s4) 0 0;text-align:right}  /* saat ile öğün adının taban çizgisi hizalansın */
.mt b{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:var(--fs-3);
  font-variant-numeric:tabular-nums;color:var(--soft);letter-spacing:-.2px}
/* omurga: oluğun sağ kenarında sürekli çizgi, son öğünde kısalır */
.mt::before{content:"";position:absolute;right:0;top:0;bottom:calc(-1 * var(--s3));
  width:2px;background:var(--faint)}
.meal:last-child .mt::before{bottom:auto;height:26px}
/* nokta: o öğünün ne kadarının bittiğini gösterir — altındaki ince çubuğun yerini aldı */
.mt::after{content:"";position:absolute;right:-5px;top:17px;width:12px;height:12px;border-radius:50%;
  background:conic-gradient(from 180deg,var(--rose-mid) calc(var(--mp,0) * 360deg),rgba(90,44,70,.15) 0);
  transition:background var(--d3) var(--ease-out),box-shadow var(--d3)}
.meal.now .mt::after{box-shadow:0 0 0 4px rgba(176,58,99,.16)}
.meal.done .mt::after{background:var(--mint)}
.meal.done .mt b{color:var(--soft)}
.mb{background:var(--paper-card);border:1.5px solid var(--line);border-radius:var(--r-3);
  padding:var(--s3) var(--s4);box-shadow:var(--e1)}
.meal h3{margin:0 0 var(--s2);font-size:var(--fs-4);font-weight:700;display:flex;align-items:center;gap:var(--s2);min-width:0}
.meal h3 .mn{min-width:0;overflow-wrap:anywhere}
.meal h3 button{margin-left:auto;flex:0 0 auto;border:0;background:none;width:var(--hit);height:36px;display:grid;place-items:center}
/* satırın tamamı tek hedef: daha önce dairelerin 44px görünmez alanları komşu
   satıra taşıyor ve yanlış maddeyi işaretleyebiliyordu */
.food{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:var(--hit);padding:var(--s1) 0;
  border:0;background:none;font-family:inherit;font-size:var(--fs-4);color:var(--plum);text-align:left;
  transition:opacity var(--d2),color var(--d2)}
.food .t{min-width:0;overflow-wrap:anywhere;transition:text-decoration-color var(--d2)}
.food .c{width:30px;height:30px;flex:0 0 auto;border-radius:50%;border:2px solid var(--faint);
  display:grid;place-items:center;
  transition:background var(--d2),border-color var(--d2),transform var(--d1) var(--ease-out)}
.food:active .c{transform:scale(var(--press-sm))}
.food.ok{color:var(--soft)}
.food.ok .t{text-decoration:line-through}
.food.ok .c{background:rgba(143,208,180,.22);border-color:transparent}
@keyframes mealIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
.meal.now .mb{border-color:var(--rose2)}
/* `mealIn` giriş animasyonu `both` ile bitince opaklığı 1'de kilitliyordu —
   animasyonlar normal bildirimleri ezer — ve tamamlanmış öğün sönükleşmiyordu.
   Animasyon `backwards`a çevrildi; geçiş sıçramayı yumuşatıyor. */
.meal.done{opacity:.82}
/* Biten bir öğünün maddelerini tek tek göstermeye gerek yok; dört maddelik bir
   kahvaltı 200px yer kaplıyordu. Kapanınca 44px'e iniyor, dokununca geri açılıyor
   — yanlış işaretlediysen geri alabilmen gerek. */
.msum{display:none}
.meal.done .msum{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:var(--hit);
  border:0;background:none;padding:0;font-family:inherit;font-size:var(--fs-3);
  color:var(--soft);text-align:left}
.meal.done:not(.open) .food{display:none}
.msum .chev{margin-left:auto;flex:0 0 auto;transition:transform var(--d2) var(--ease-out)}
.meal.done.open .msum .chev{transform:rotate(180deg)}
.mnow{margin:0 0 var(--s2);font-size:var(--fs-2);font-weight:700;color:var(--rose-ink)}
/* işaretlenen tik çizilerek gelsin — hepsi birden değil, sadece dokunulan */
.food .c.just{animation:cpop var(--d3) var(--ease-out)}
@keyframes cpop{0%{transform:scale(1)}42%{transform:scale(1.24)}100%{transform:scale(1)}}
.food .c.just svg path{stroke-dasharray:32;stroke-dashoffset:32;animation:tickdraw var(--d3) var(--ease-out) .05s forwards}
@keyframes tickdraw{to{stroke-dashoffset:0}}

:focus-visible{outline:3px solid var(--rose-ink);outline-offset:3px;border-radius:var(--r-2)}
input[type=number]{flex:1;width:100%;font-family:inherit;font-size:var(--fs-4);font-weight:500;color:var(--plum);
  background:var(--paper-card);border:1.5px solid var(--line);border-radius:var(--r-2);padding:var(--s4) var(--s4);outline:none;-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.name{text-shadow:0 2px 22px rgba(255,255,255,.55)}
.note{margin:var(--s2) 0 0;font-size:var(--fs-3);color:var(--soft);font-style:italic}
.nudge{animation:nudge 2.6s ease-in-out infinite}
@keyframes nudge{0%,88%,100%{transform:none}92%{transform:scale(1.1)}96%{transform:scale(.96)}}
.tag{display:inline-block;margin-left:var(--s2);padding:var(--s0) var(--s2);border-radius:999px;font-size:var(--fs-1);font-weight:700;
  background:rgba(176,58,99,.12);color:var(--rose-ink);vertical-align:2px}
.tag.low{background:rgba(154,84,22,.14);color:var(--amber-ink)}
.hdrow{display:flex;align-items:center;gap:var(--s3);justify-content:space-between;margin:0 0 var(--s3)}
.hdrow b{font-size:var(--fs-2);font-weight:700;color:var(--soft)}
.hdrow span{font-size:var(--fs-2);color:var(--rose-ink);font-weight:700}
#a2hs{position:fixed;left:20px;right:20px;max-width:calc(var(--shell) - 40px);margin-inline:auto;
  bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:7;
  display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-3);background:var(--paper-card);
  box-shadow:var(--e2);font-size:var(--fs-3);color:var(--soft);
  transform:translateY(140%);transition:transform var(--d3) var(--ease-out)}
#a2hs.on{transform:translateY(0)}
#a2hs button{margin-left:auto;flex:0 0 auto;border:0;background:none;
  width:var(--hit);height:var(--hit);display:grid;place-items:center}

.bit{position:fixed;z-index:9;pointer-events:none;animation:fly var(--d6) var(--ease-out) forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.35);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.05);opacity:0}}

/* Fare girdisi. Daha önce tek bir :hover kuralı yoktu — arayüz imleçle ölüydü.
   Tek jest, iki rol: hover renklendirir, basma hareket ettirir. İkisi karışmaz,
   böylece dokunmatikte kaybolan tek şey renk oluyor.
   Kart kaldırma / gölge büyütme refleksine bilerek girilmedi ve hover yalnız
   gerçekten tıklanabilir şeylere verildi: tıklanmayan bir kartı hover'da
   oynatmak yanlış vaat. Ton arka planı değiştirmeden üstüne biniyor, cam
   yüzeylerin backdrop-filter'ı bozulmasın diye. */
@media (hover:hover) and (pointer:fine){
  button,.tap,.food,.wk,.hrow{cursor:pointer}
  button:disabled{cursor:default}
  .bell:hover,.lbl:hover,.add:hover,.gbtn:not(:disabled):hover,.chip:hover,
  .row:hover,.shape:hover,.days button:hover,.wtap:hover,.wmin:hover,
  .week .wk:hover .col,.dw:hover .col{
    background-image:linear-gradient(var(--hov),var(--hov))}
  .bell:hover,.lbl:hover,.add:hover,.chip:hover,.shape:hover,
  .days button:hover,.gbtn:not(:disabled):hover{border-color:var(--hov-line)}
  /* gradyan zaten background-image; ton bindirilemez, canlandırılır */
  .take:not(:disabled):hover,.save:not(:disabled):hover,.mini:hover,
  .del:hover{filter:saturate(1.1) brightness(1.05)}
  .lnk:hover,.toast button:hover,.meal h3 button:hover,#a2hs button:hover{
    background-image:linear-gradient(var(--hov),var(--hov));border-radius:999px}
  .food:hover .t{color:var(--rose-ink)}
  .food:hover .c{border-color:var(--hov-line)}
  .food.ok:hover .t{color:var(--soft)}
  .tabs button:not(.on):hover{opacity:.85}
}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<script id="vs" type="x-shader/x-vertex">
attribute vec2 a;
void main(){gl_Position=vec4(a,0.,1.);}
</script>

<script id="fs" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 u_res;
uniform float u_time,u_split,u_alive,u_glow,u_shape,u_scale,u_apart;
uniform vec2 u_off;
uniform vec3 u_col;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float hash(vec3 p){return fract(sin(dot(p,vec3(21.98,78.23,45.17)))*43758.5453);}
float blob(vec2 p,vec2 c,float r){float d=length(p-c)/r;return exp(-d*d);}

float sdCapsule(vec3 p,float h,float r){p.y-=clamp(p.y,-h,h);return length(p)-r;}
float sdTablet(vec3 p){
  float ra=.34,rb=.07,h=.08;
  vec2 d=vec2(length(p.xz)-ra+rb, abs(p.y)-h);
  return min(max(d.x,d.y),0.)+length(max(d,vec2(0.)))-rb;
}
float sdEllipsoid(vec3 p,vec3 r){
  float k0=length(p/r);
  float k1=max(length(p/(r*r)),1e-4);
  return k0*(k0-1.)/k1;
}
/* kalp: 45° döndürülmüş kare (alt uç) + üst iki köşeye oturan iki daire.
   Küreleri yumuşak birleştirince loblar arasındaki çentik kapanıp yumru oluyordu. */
float smin(float a,float b,float k){
  float h=clamp(.5+.5*(b-a)/k,0.,1.);
  return mix(b,a,h)-k*h*(1.-h);
}
/* kalp: alt gövde iki büyük dairenin kesişimi (mercek) — kenarlar uca doğru
   yay çizerek daralır. Önce 45° döndürülmüş kare kullanıyordum, alt kenarlar
   düz çizgi oluyordu ve dairelerle kesiştiği yerde siluette kırık kalıyordu. */
float heart2(vec2 p){
  float lob=smin(length(p-vec2(-.125,.105))-.145,
                 length(p-vec2( .125,.105))-.145,.012);  // üstteki çentik
  float lens=max(length(p-vec2(-.425,.212))-.64,
                 length(p-vec2( .425,.212))-.64);
  /* kesik çentiğe yaklaşınca yumuşak birleşim çentiği dolduruyordu — aşağı alındı */
  lens=max(lens,p.y-.10);
  return smin(lob,lens,.06);                             // omuzdaki geçiş yumuşasın
}
float sdHeart(vec3 p){
  p.y-=.008;
  vec2 w=vec2(heart2(p.xy),abs(p.z)-.115);
  return min(max(w.x,w.y),0.)+length(max(w,vec2(0.)))-.03;
}
float body(vec3 p){
  if(u_shape<.5)  return sdCapsule(p,.22,.25);
  if(u_shape<1.5) return sdTablet(p);
  if(u_shape<2.5) return sdEllipsoid(p,vec3(.22,.30,.22));
  return sdHeart(p);
}
vec3 axis(){
  if(u_shape>2.5) return vec3(1.,0.,0.);       // kalp sol/sağ ikiye ayrılır
  return (u_shape>.5&&u_shape<1.5)?vec3(1.,0.,0.):vec3(0.,1.,0.);
}
vec2 map(vec3 p){
  p/=max(u_scale,.05);
  /* kalp dik durmalı: hapa göre ayarlanmış -20° eğim silueti bozuyordu */
  float hs=step(2.5,u_shape);
  p.y-=sin(u_time*.55)*.04;
  p.xz*=rot(mix(u_time*.22,sin(u_time*.45)*.30,hs));
  p.xy*=rot(mix(-.36+sin(u_time*.34)*.06,sin(u_time*.3)*.05,hs));
  vec3 ax=axis();
  /* açılış sarmalı: a=1 iken yarımlar aşağıda ve birbirinin tam karşısında;
     a küçüldükçe merkez yükselir, yarıçap kapanır, açı çözülür —
     ikisi de aynı yönde döndüğü için birbirini kovalıyormuş gibi okunur */
  float a=u_apart;
  float ang=a*6.2832;                    // tam bir tur: başlangıçta yatay karşılıklı
  float R=a*.70;                         // yarıçap ortada kapanır
  float cy=-a*.85;                       // merkez aşağıdan asıl noktaya yükselir
  vec2 o=vec2(cos(ang),sin(ang))*R;
  vec3 oA=vec3( o.x, o.y+cy,0.);
  vec3 oB=vec3(-o.x,-o.y+cy,0.);
  float s=u_split*.38;
  float hinge=u_split*.28;
  /* yarımlar kendi etraflarında Y ekseninde döner (xz düzlemi) —
     ekran düzleminde dönmek onları fırıldak gibi yassı gösteriyordu.
     Hap ikiye ayrılırken kullanılan menteşe xy'de kalır. */
  vec3 pa=p-ax*s-oA; pa.xy*=rot(-hinge); pa.xz*=rot(-ang);
  float da=max(body(pa),-dot(pa,ax));
  vec3 pb=p+ax*s-oB; pb.xy*=rot(hinge);  pb.xz*=rot(-ang);
  float db=max(body(pb), dot(pb,ax));
  float sc=max(u_scale,.05);
  return da<db?vec2(da*sc,1.):vec2(db*sc,2.);
}
vec3 nrm(vec3 p){
  vec2 e=vec2(.0015,0.);
  return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,
                        map(p+e.yxy).x-map(p-e.yxy).x,
                        map(p+e.yyx).x-map(p-e.yyx).x));
}
vec3 amb(vec2 q){
  float t=u_time*.1;
  vec3 c=mix(vec3(1.,.957,.973),vec3(1.,.898,.937),q.y*.5+.5);
  c=mix(c,vec3(1.,.796,.867),clamp(blob(q,vec2(sin(t*1.1)*.42-.22,cos(t*.9)*.34+.40),.66),0.,1.)*.68);
  c=mix(c,vec3(1.,.867,.808),clamp(blob(q,vec2(cos(t*.8)*.46+.34,sin(t*1.2)*.36-.30),.58),0.,1.)*.52);
  c=mix(c,vec3(.918,.867,1.),clamp(blob(q,vec2(sin(t*.6)*.55,cos(t*.7)*.45-.52),.5),0.,1.)*.44);
  c=mix(c,u_col,clamp(blob(q,vec2(cos(t*1.3)*.3-.36,sin(t*.5)*.28+.02),.42),0.,1.)*.2);
  return c;
}
vec3 ambDir(vec3 d){return amb(d.xy*1.15);}

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*u_res)/u_res.y;
  uv.y-=.05;
  vec3 col=amb(uv);
  col*=1.-.15*exp(-length((uv-vec2(0.,-.42))*vec2(1.5,4.0))*2.2)*u_alive;

  vec3 ro=vec3(0.,0.,3.0);
  /* yalnız nesne kayar, zemin yerinde kalır: hap kadranın merkezine oturuyor */
  vec3 rd=normalize(vec3(uv-u_off,-1.95));
  float t=0.,hit=0.,mid=0.;
  if(u_alive>.02){
    for(int i=0;i<70;i++){
      vec3 p=ro+rd*t;
      vec2 d=map(p);
      if(d.x<.0018){hit=1.;mid=d.y;break;}
      t+=d.x*.85;
      if(t>6.)break;
    }
  }
  if(hit>.5){
    vec3 p=ro+rd*t;
    vec3 n=nrm(p);
    vec3 l1=normalize(vec3(.45,.85,.7)),l2=normalize(vec3(-.6,.2,.5));
    float fres=.03+.97*pow(1.-clamp(dot(n,-rd),0.,1.),4.5);
    vec3 rr=refract(rd,n,1./1.42);
    vec3 ip=p+rr*.02; float th=0.;
    for(int j=0;j<16;j++){
      float d=-map(ip).x;
      if(d<.0028)break;
      ip+=rr*d; th+=d;
    }
    vec3 en=nrm(ip);
    vec3 ex=refract(rr,-en,1.42);
    if(dot(ex,ex)<.001)ex=rr;
    /* soğurma ışının kat ettiği yola bağlı; hap küçüldüğünde yol da kısalıyor ve
       renk solup beyaza kaçıyordu. Ölçeğe göre normalize ediyoruz. */
    vec3 tint=exp(-(1.-u_col)*th*(mid<1.5?2.3:1.5)*(.78/max(u_scale,.05)));
    vec3 trans=ambDir(ex)*tint;
    float grain=step(.96,hash(floor(ip*24.)));
    trans=mix(trans,u_col,grain*.12);
    float dif=clamp(dot(n,l1),0.,1.);
    float spe=pow(clamp(dot(reflect(-l1,n),-rd),0.,1.),80.)*.5
             +pow(clamp(dot(reflect(-l2,n),-rd),0.,1.),36.)*.14;
    vec3 sur=mix(trans,ambDir(reflect(rd,n)),fres*.45);
    sur=mix(sur,vec3(1.),fres*.18);
    sur+=u_col*dif*.06;
    sur+=vec3(1.)*spe;
    col=mix(col,sur,u_alive);
  }
  col=mix(col,mix(col,u_col,.5),u_glow*.25*exp(-length(uv)*2.2));
  col+=(hash(vec3(gl_FragCoord.xy,fract(u_time)))-.5)*.008;
  gl_FragColor=vec4(clamp(col,0.,1.),1.);
}
</script>

<script>
/* ---------------- telemetri ----------------
   Realtime Database'e REST ile yazar. SDK bilerek kullanılmadı: ~150KB'lık
   gstatic paketi açılış sekansıyla yarışıyordu. Olaylar bellekte biriktirilir,
   localStorage'a yedeklenir (çevrimdışı/çökme sonrası bir sonraki açılışta gider),
   sayfa kapanırken sendBeacon ile son parti de çıkar.

const TELE=(function(){
  const DB='https://roomcast-4ef14-default-rtdb.europe-west1.firebasedatabase.app';
  const QK='ilac.tq', DK='ilac.did';
  let q=[], timer=null, sending=false, did='', sid='';

  function uid(){

  try{

      if(v&&/^[A-Za-z0-9._-]{6,64}$/.test(v)){
        pinned=v;u.delete('did');
        const q=u.toString();

      }
    }catch(e){}

  function flush(beacon){

          q=q.slice(batch.length);persist();

    try{
      fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:body,keepalive:true})
        .then(r=>{

             bir sonraki açılışta yeniden denenir */
          if(r&&r.ok){q=q.slice(batch.length);persist();if(q.length)flush()}
        })

    }catch(e){sending=false}
  }
  function log(type,data){
    try{
      const e={t:now(),ts:new Date().toISOString(),ty:type};
      if(data)for(const k in data)if(data[k]!==undefined&&data[k]!==null)e[k]=data[k];

      sw:screen.width,sh:screen.height,vw:innerWidth,vh:innerHeight,dpr:dpr,
      standalone:standalone,webgl:gl,reduceMotion:rm,
      ref:document.referrer||'',href:location.href.slice(0,300)};
  }
  function sessionMeta(extra){
    try{
      const body=JSON.stringify(Object.assign({sid:sid,start:t0,startIso:new Date(t0).toISOString()},env(),extra||{}));
      fetch(DB+'/devices/'+did+'/sessions/'+sid+'.json',
        {method:'PATCH',headers:{'Content-Type':'application/json'},body:body,keepalive:true}).catch(()=>{});
    }catch(e){}

    const dur=now()-t0, act=activeMs+(visible?now()-activeFrom:0);

      const body=JSON.stringify({sid:sid,end:now(),endIso:new Date().toISOString(),durMs:dur,activeMs:act});

        /* sendBeacon yalnız POST atabilir; sessions/{sid} altına POST etmek
           PATCH ile yazılan alanlarla şekil çakışması yaratıyordu — ayrı,
           yalnızca eklenen bir koleksiyona gidiyor */
        navigator.sendBeacon(DB+'/devices/'+did+'/sessionEnds.json',
          new Blob([body],{type:'application/json'}));
      }else{
        fetch(DB+'/devices/'+did+'/sessions/'+sid+'.json',
          {method:'PATCH',headers:{'Content-Type':'application/json'},body:body,keepalive:true}).catch(()=>{});
      }
    }catch(e){}
  }

  document.addEventListener('visibilitychange',()=>{
    try{
      if(document.hidden){
        visible=false;activeMs+=now()-activeFrom;
        log('gizlendi',{activeMs:activeMs});flush(true);endSession(true);
      }else{

      }
    }catch(e){}
  });
  addEventListener('pagehide',()=>{try{
    if(visible){visible=false;activeMs+=now()-activeFrom}
    log('kapandi',{activeMs:activeMs});flush(true);endSession(true);
  }catch(e){}});
  setInterval(()=>{try{
    if(!document.hidden)log('nabiz',{activeMs:activeMs+(now()-activeFrom),durMs:now()-t0});
  }catch(e){}},30000);

  return {log:log,flush:flush,meta:sessionMeta,did:did,sid:sid,env:env,
          active:()=>activeMs+(visible?now()-activeFrom:0)};
})();

function alignScene(){
  const t=document.querySelector('.track');

  const r=t.getBoundingClientRect();
  if(!r.width||!innerHeight)return null;
  const cx=r.x+r.width/2,cy=r.y+r.height/2;

function sh(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.warn(gl.getShaderInfoLog(s));return s}
function initGL(){
  if(!gl){document.body.style.background='radial-gradient(120% 70% at 30% 25%,#FFDCEA,#FFEFF5)';return false}
  const p=gl.createProgram();
  gl.attachShader(p,sh(gl.VERTEX_SHADER,$('vs').textContent));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,$('fs').textContent));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){console.warn(gl.getProgramInfoLog(p));return false}
  gl.useProgram(p);
  const b=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const a=gl.getAttribLocation(p,'a');
  gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
  ['u_res','u_time','u_split','u_alive','u_glow','u_shape','u_scale','u_apart','u_col','u_off'].forEach(n=>U[n]=gl.getUniformLocation(p,n));
  resize();return true;
}

  if(!gl)return;

  cv.width=Math.floor(innerWidth*d);cv.height=Math.floor(innerHeight*d);

/* CSS'teki --ease-out ile aynı karakterde tek bir JS eğrisi.
   Önce açılış, küçülme, hap büyümesi ve ibre süpürmesi ayrı eğriler
   kullanıyordu; iki sekans birbirine yabancı duruyordu. */
const EOUT=k=>1-Math.pow(1-k,2.4);
function tween(a,b,ms,set,end,ease){
  const st=performance.now();
  (function s(n){
    const k=Math.min(1,(n-st)/ms);
    const e=ease?ease(k):(k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2);
    set(a+(b-a)*e);
    if(k<1)requestAnimationFrame(s);else if(end)end();
  })(st);
}

const esc=s=>String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

/* ---------------- kadran ----------------
   00:00 tepe · 06:00 sağ · 12:00 alt · 18:00 sol */
const R=126, CIRC=2*Math.PI*R, NS='http://www.w3.org/2000/svg';
function pt(m,r){const a=(m/1440)*Math.PI*2-Math.PI/2;return[150+Math.cos(a)*r,150+Math.sin(a)*r]}
function drawDial(){
  // gece bandı 21:00 → 06:00
  const nightLen=((360-1260+1440)%1440)/1440*CIRC;
  $('night').setAttribute('stroke-dasharray',nightLen.toFixed(1)+' '+(CIRC-nightLen).toFixed(1));
  $('night').setAttribute('stroke-dashoffset',(-(1260/1440)*CIRC).toFixed(1));

  let s='';
  for(let h=0;h<24;h++){
    const [x1,y1]=pt(h*60,R-(h%3?3:7)),[x2,y2]=pt(h*60,R);
    /* gece bandının üstündeki çentikler koyu mürekkeple görünmez kalıyordu */
    const nk=(h>=21||h<6);
    const col=nk?`rgba(255,255,255,${h%3?.34:.58})`:`rgba(90,44,70,${h%3?.12:.28})`;
    s+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${col}" stroke-width="${h%3?1:1.5}"/>`;
  }
  $('ticks').innerHTML=s;

  let l='';
  for(let h=0;h<24;h+=3){
    const [x,y]=pt(h*60,R+18);
    l+=`<text class="hlab" x="${x.toFixed(1)}" y="${(y+3.4).toFixed(1)}" text-anchor="middle">${pad(h)}</text>`;
  }
  $('labels').innerHTML=l;

  // ay (gece yarısı) ve güneş (öğle)
  const [mx,my]=pt(0,R-24),[sx,sy]=pt(720,R-24);
  let g=`<g opacity=".62"><path d="M${(mx+3).toFixed(1)} ${(my-5).toFixed(1)}a5.6 5.6 0 1 0 0 10 6.8 6.8 0 0 1 0-10z" fill="#6B54A4"/></g>
    <g opacity=".45" transform="translate(${sx.toFixed(1)} ${sy.toFixed(1)})"><circle r="3.6" fill="#E8A65C"/>`;
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    g+=`<line x1="${(Math.cos(a)*5.4).toFixed(1)}" y1="${(Math.sin(a)*5.4).toFixed(1)}" x2="${(Math.cos(a)*7.4).toFixed(1)}" y2="${(Math.sin(a)*7.4).toFixed(1)}" stroke="#E8A65C" stroke-width="1.3" stroke-linecap="round"/>`;
  }
  $('glyphs').innerHTML=g+'</g>';
}
const nowMinF=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60};
let handLock=false;
function drawHand(n){
  $('elapsed').setAttribute('stroke-dasharray',(CIRC*n/1440).toFixed(2)+' '+CIRC.toFixed(2));
  const [x1,y1]=pt(n,R-13),[x2,y2]=pt(n,R+8);
  $('hand').innerHTML=`<line class="hand" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>
    <circle class="handdot" cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="3"/>`;
}
function tickClock(){
  const d=new Date();
  $('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes());
  $('date').textContent=DAYS[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3);
  if(!handLock)drawHand(nowMinF());
}
/* ibre gece yarısından şu ana süzülerek gelir */
function sweepHand(ms){
  handLock=true;
  const to=nowMinF(),st=performance.now();
  (function s(t){
    const k=Math.min(1,(t-st)/ms);
    drawHand(to*EOUT(k));
    if(k<1)requestAnimationFrame(s);else handLock=false;
  })(st);
}
/* açılış / geri dönüş sekansı */
function playReveal(full,keepScale){
  const top=document.querySelector('.top'),foot=$('foot'),track=document.querySelector('.track');
  [[top,'reveal-top'],[foot,'reveal-foot']].forEach(function(pair){
    pair[0].classList.remove(pair[1]);void pair[0].offsetWidth;pair[0].classList.add(pair[1]);
  });
  ['ticks','labels','glyphs'].forEach((id,i)=>{
    const el=$(id);el.style.animation='none';void el.getBBox;
    el.style.animation='fadeIn var(--d4) var(--ease-out) '+(i*140+(full?190:60))+'ms both';
  });
  if(full){track.classList.remove('draw');void track.getBBox;track.classList.add('draw')}
  render(false,true);
  sweepHand(full?1200:640);
  syncScene();
  if(!keepScale){scene.scale=.12;tween(.12,PILL,full?880:560,x=>scene.scale=x,null,EOUT)}
}

/* ---------------- ekran ---------------- */
let active=null,manual=null,lastMin=-1,lastDay=todayKey(),booted=false,handoff=false;
function render(swap,animate){
  const all=doses();
  const cur=(manual&&!isDone(manual.key))?manual:nextDose();
  active=cur;

  const g=$('beads');g.innerHTML='';
  all.forEach((d,i)=>{
    const [x,y]=pt(mins(d.time),R);
    const tk=isTaken(d.key),sk=isSkipped(d.key),sel=cur&&cur.key===d.key;
    if(!tk&&isLate(d)){
      const ping=document.createElementNS(NS,'circle');
      ping.setAttribute('class','late');ping.setAttribute('cx',x.toFixed(1));ping.setAttribute('cy',y.toFixed(1));
      ping.setAttribute('r',7);ping.setAttribute('fill','none');
      ping.setAttribute('stroke',d.med.color);ping.setAttribute('stroke-width',2);
      g.appendChild(ping);
    }
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('class','bead');c.setAttribute('cx',x.toFixed(1));c.setAttribute('cy',y.toFixed(1));
    c.setAttribute('r',sel?7.5:5);
    c.setAttribute('fill',tk?'#8FD0B4':(sk?'rgba(90,44,70,.22)':d.med.color));
    c.setAttribute('stroke','#fff');c.setAttribute('stroke-width',sel?2.6:2);
    c.setAttribute('opacity',tk?.6:(sk?.5:1));
    if(animate){c.style.animation='pop .58s var(--ease-spring) both';c.style.animationDelay=(i*95)+'ms'}
    g.appendChild(c);
    if(sel){
      const [lx,ly]=pt(mins(d.time),R-26);
      const tx=document.createElementNS(NS,'text');
      tx.setAttribute('class','dlab');tx.setAttribute('x',lx.toFixed(1));tx.setAttribute('y',(ly+4).toFixed(1));
      tx.setAttribute('text-anchor','middle');tx.textContent=d.time;
      tx.style.animation='pop .5s var(--ease-spring) '+(animate?(all.length*70+80):0)+'ms both';
      g.appendChild(tx);
    }
    const hit=document.createElementNS(NS,'circle');
    hit.setAttribute('cx',x.toFixed(1));hit.setAttribute('cy',y.toFixed(1));hit.setAttribute('r',17);
    hit.setAttribute('fill','transparent');hit.style.cursor='pointer';
    hit.addEventListener('click',()=>{if(!isDone(d.key)){manual=d;render(true)}});
    g.appendChild(hit);
  });

  const write=()=>{
    if(cur){
      $('nName').textContent=cur.med.name;
      $('nSub').innerHTML='<b>'+cur.time+'</b><span>'+when(cur.time)+'</span>';
      $('nNote').textContent=cur.med.note||'';
      $('btnSkip').style.display='';
      $('btnTake').disabled=false;
      if(booted&&!handoff){
        scene.col=hex2rgb(cur.med.color);
        scene.shape=Math.max(0,SHAPES.indexOf(cur.med.shape));
        scene.alive=(curTab==='med')?1:0;scene.split=0;
      }
    }else{
      $('nName').textContent=all.length?'Bugünlük bitti':'Liste boş';
      if(all.length){
        const st=streak(),tkn=all.filter(d=>isTaken(d.key)).length;
        $('nSub').innerHTML='<b>'+tkn+'/'+all.length+'</b><span>'+(st?st+' gün üst üste':'yarın sabah görüşürüz')+'</span>';
      }else $('nSub').innerHTML='<span>aşağıdan ilk ilacını ekle</span>';
      $('nNote').textContent='';
      $('btnSkip').style.display='none';
      $('btnTake').disabled=true;
      if(booted&&!handoff)scene.alive=0;
    }
    /* gün bitti ekranı: bugün için doz vardı ve hepsi kapandıysa */
    const isDone=!cur&&all.length>0,pg=$('pgMed');
    if(isDone){
      drawDone(all);
      if(!pg.classList.contains('is-done')){
        pg.classList.add('is-done');
        const dn=$('done');dn.classList.remove('in');void dn.offsetWidth;dn.classList.add('in');
      }
    }else{pg.classList.remove('is-done');$('done').classList.remove('in')}
    const skn=all.filter(d=>isSkipped(d.key)).length;
    $('count').textContent=all.length?(all.filter(d=>isTaken(d.key)).length+' / '+all.length+' alındı'+(skn?' · '+skn+' atlandı':'')):'';
    $('btnAdd').classList.toggle('nudge',!all.length);
  };
  if(swap){$('foot').classList.add('swap');setTimeout(()=>{write();$('foot').classList.remove('swap')},180)}
  else write();
}

function firstTomorrow(){
  const d=new Date();d.setDate(d.getDate()+1);
  const ds=dosesFor(d);
  return ds.length?ds[0].time:null;
}
function drawDone(all){
  const tkn=all.filter(d=>isTaken(d.key)).length,skn=all.length-tkn;
  $('doneSub').textContent=tkn+' doz alındı'+(skn?' · '+skn+' atlandı':'');
  const st=streak(),ad=adherence7();
  $('doneStats').innerHTML='<span><b>'+st+'</b>gün seri</span>'+
    (ad===null?'':'<span><b>%'+ad+'</b>7 gün uyum</span>');
  const t=firstTomorrow();
  $('doneNext').innerHTML=t?'Yarın ilk doz <b>'+t+'</b>':'Yarın planlı doz yok';
}

let toastTimer=null,undoFn=null;
/* geri alma penceresi — çubuğun süresi ve zamanlayıcı aynı yerden okunur */
const UNDO=5000;
function toast(msg,fn,label){
  $('toastMsg').textContent=msg;
  undoFn=fn;
  $('toastIco').innerHTML=fn?ico.tickM:'';
  $('toastIco').style.display=fn?'':'none';
  $('toastBtn').innerHTML=(label?'':ico.undo)+'<span>'+(label||'Geri al')+'</span>';
  $('toastBtn').style.display=fn?'':'none';

$('toastBtn').addEventListener('click',()=>{

/* hem kadrana dokunma hem de adı yazan "Aldım" düğmesi buraya bağlanır */
function takeDose(px,py,via){
  if(!active)return;
  const d=active,k=todayKey();
  tlog('doz_alindi',{ilac:d.med.name,ilacId:d.med.id,saat:d.time,sekil:d.med.shape,renk:d.med.color,
    gecikmeDk:nowMin()-mins(d.time),stok:(typeof d.med.stock==='number'?d.med.stock:null),
    kaynak:via||'bilinmiyor',gunToplam:doses().length});
  manual=null;scene.glow=1;
  if(navigator.vibrate)navigator.vibrate([10,30,14]);
  hearts(px||innerWidth/2,py||innerHeight*.45,d.med.color);
  tween(0,1,600,x=>scene.split=x,()=>tween(1,0,320,x=>scene.alive=x,()=>{
    S.taken[k]=(S.taken[k]||[]).concat([d.key]);
    const dec=typeof d.med.stock==='number'&&d.med.stock>0;
    if(dec)d.med.stock--;
    save();render(true);
    if(!nextDose())setTimeout(playFinale,120);
    toast(d.med.name+' alındı',()=>{
      tlog('doz_geri_alindi',{ilac:d.med.name,ilacId:d.med.id,saat:d.time});
      S.taken[k]=(S.taken[k]||[]).filter(x=>x!==d.key);
      if(dec)d.med.stock++;
      save();render(true);
    });
    if(typeof d.med.stock==='number'&&d.med.stock<=5)setTimeout(()=>toast(d.med.name+' azalıyor — '+d.med.stock+' doz kaldı'),5300);
  }));
}
$('tap').addEventListener('click',e=>takeDose(e.clientX,e.clientY,'kadran'));
$('btnTake').addEventListener('click',()=>takeDose(innerWidth/2,innerHeight*.45,'dugme'));
function hearts(x,y,color){
  for(let i=0;i<12;i++){
    const el=document.createElement('span'),z=10+Math.random()*12,a=Math.random()*Math.PI*2,r=55+Math.random()*105;
    el.className='bit';
    el.style.cssText='left:'+(x-z/2)+'px;top:'+(y-z/2)+'px;--dx:'+(Math.cos(a)*r).toFixed(0)+'px;--dy:'+(Math.sin(a)*r-50).toFixed(0)+'px;animation-delay:'+(i*16)+'ms';
    el.innerHTML=`<svg width="${z}" height="${z}" viewBox="0 0 24 24"><path d="M12 21s-8-4.9-8-10.5A4.5 4.5 0 0 1 12 7.2 4.5 4.5 0 0 1 20 10.5C20 16.1 12 21 12 21z" fill="${i%3?color:'#F08AAE'}"/></svg>`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),1500);
  }
}

$('btnSkip').addEventListener('click',()=>{
  if(!active)return;
  const d=active,k=todayKey();

/* ---------------- bildirim ---------------- */
const notified={};
function bellState(){
  const has='Notification'in window;
  const perm=has?Notification.permission:'yok';
  const ok=perm==='granted';
  $('bellIco').innerHTML=ok?ico.bellOn:ico.bellOff;
  $('bell').classList.toggle('on',ok);
  $('bellTxt').textContent=!has?'Bu tarayıcı desteklemiyor'
    :ok?'Açık — sayfa açıkken hatırlatır'
    :perm==='denied'?'Tarayıcı ayarlarından açman gerekiyor'
    :'Kapalı — açmak için dokun';
}
$('bell').addEventListener('click',()=>{
  if(!('Notification'in window)){toast('Bu tarayıcı bildirimi desteklemiyor');return}
  if(Notification.permission==='granted'){toast('Bildirimler açık');return}
  if(Notification.permission==='denied'){toast('Bildirim izni reddedilmiş, ayarlardan aç');return}
  Notification.requestPermission().then(p=>{
    tlog('bildirim_izni',{sonuc:p});
    bellState();
    toast(p==='granted'?'Bildirimler açıldı':'Bildirim izni verilmedi');
  });
});
function checkNotify(){
  if(!('Notification'in window)||Notification.permission!=='granted')return;
  const n=nowMin(),day=todayKey();
  doses().forEach(d=>{
    if(isDone(d.key))return;
    const k=day+'|'+d.key, diff=n-mins(d.time);
    if(!notified[k]&&diff>=0&&diff<=2){
      notified[k]=1;
      tlog('bildirim_gonderildi',{ilac:d.med.name,ilacId:d.med.id,saat:d.time});
      try{new Notification('İlaç zamanı',{body:d.med.name+' — '+d.time,tag:k});}catch(e){}
      if(navigator.vibrate)navigator.vibrate([20,60,20,60,20]);
      toast(d.med.name+' vakti geldi',()=>{
        tlog('bildirim_ertelendi',{ilac:d.med.name,saat:d.time});
        setTimeout(()=>{delete notified[k]},10*60*1000);
        toast('10 dakika sonra yeniden hatırlatılacak');
      },'10 dk ertele');
    }
  });
}

/* ---------------- sheet ---------------- */
let openId=null,openerEl=null;
/* Panel açıkken odak arkadaki sayfaya kaçıyordu: klavye kullanıcısı paneli açıp
   Tab'layınca perdenin altındaki düğmelere düşüyordu. Bu üçü birlikte çözer. */
const FOCUSABLE='button:not([disabled]),input:not([disabled]),textarea:not([disabled]),'+
  'select:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])';
const focusablesIn=el=>Array.prototype.filter.call(el.querySelectorAll(FOCUSABLE),
  e=>e.offsetParent!==null||getComputedStyle(e).position==='fixed');
const show=id=>{
  tlog('panel_acildi',{panel:id});
  openerEl=(document.activeElement&&document.activeElement!==document.body)?document.activeElement:null;
  openId=id;const s=$(id);
  s.classList.add('open');$('scrim').classList.add('open');
  /* Odağı panelin kendisine al, ilk input'a değil: metin alanına programatik
     odaklanmak mobilde klavyeyi açabiliyor ve paneli kapatıyor. Tab ilk
     kontrole geçer. Geçiş bitince odaklanıyoruz, yoksa görünmezken oluyor. */
  setTimeout(()=>{if(openId!==id)return;try{s.focus({preventScroll:true})}catch(e){s.focus()}},260);
  Array.prototype.slice.call(s.children).forEach((el,i)=>{
    el.style.animation='none';void el.offsetWidth;
    el.style.animation='fadeUp .5s var(--ease-out) '+(140+i*50)+'ms both';
  });
};
const hide=()=>{if(openId){tlog('panel_kapandi',{panel:openId});$(openId).classList.remove('open')}
  $('scrim').classList.remove('open');openId=null;
  /* odak paneli açan düğmeye dönsün; dönmezse sayfanın başına savruluyordu */
  if(openerEl&&document.contains(openerEl)){try{openerEl.focus()}catch(e){}}
  openerEl=null};
$('scrim').addEventListener('click',hide);
document.addEventListener('keydown',e=>{
  if(!openId)return;
  if(e.key==='Escape'){e.preventDefault();hide();return}
  if(e.key!=='Tab')return;
  const f=focusablesIn($(openId));
  if(!f.length)return;
  const ilk=f[0],son=f[f.length-1],a=document.activeElement;
  /* panelin içinde döngü: son elemandan sonra başa, ilkten geriye sonuncuya */
  if(e.shiftKey&&(a===ilk||!$(openId).contains(a))){e.preventDefault();son.focus()}
  else if(!e.shiftKey&&(a===son||!$(openId).contains(a))){e.preventDefault();ilk.focus()}
});
let form={times:[],color:COLORS[0],shape:'capsule',days:[]},editing=null;
function drawForm(){
  $('fColors').innerHTML=COLORS.map(c=>`<button class="pick${c===form.color?' sel':''}" data-c="${c}" style="background:${c}"></button>`).join('');

/* bugünün henüz sırası gelmemiş dozu "kaçırıldı" sayılmamalı */
function dayStat(d,isToday){
  const k=keyOf(d),tk=S.taken[k]||[],sk=S.skipped[k]||[];
  let total=0,done=0,skip=0;
  dosesFor(d).forEach(ds=>{
    if(isToday&&mins(ds.time)>nowMin())return;
    total++;
    if(tk.indexOf(ds.key)>=0)done++;else if(sk.indexOf(ds.key)>=0)skip++;
  });
  return {total:total,done:done,skip:skip};
}
function adherence7(){
  let d=0,t=0;
  for(let i=6;i>=0;i--){
    const dt=new Date();dt.setDate(dt.getDate()-i);
    const st=dayStat(dt,i===0);t+=st.total;d+=st.done;
  }
  return t?Math.round(d/t*100):null;
}
/* tek ilacın bir günü: 2 tamam · 1 kısmi/atlandı · 0 kaçırıldı · -1 planlı değil */
function medDay(m,d,isToday){
  if(!activeOn(m,d))return -1;
  const k=keyOf(d),tk=S.taken[k]||[],sk=S.skipped[k]||[],n=nowMin();
  const times=isToday?m.times.filter(t=>mins(t)<=n):m.times;
  if(!times.length)return -1;
  let done=0,other=0;
  times.forEach(t=>{const key=m.id+'@'+t;
    if(tk.indexOf(key)>=0)done++;else if(sk.indexOf(key)>=0)other++;});
  if(done===times.length)return 2;
  if(done>0||other>0)return 1;
  return 0;
}

function drawWeek(grow){

  const days=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d)}

      <span class="sfill"></span><span class="fill"></span></span><span class="dl"></span></button>`).join('');
  const rows=days.map((d,i)=>{
    const s2=dayStat(d,i===6);
    return {k:keyOf(d),lab:DAYNAMES[d.getDay()],
      t:s2.total?Math.round(s2.done/s2.total*100):0,
      sp:s2.total?Math.round(s2.skip/s2.total*100):0,pc:s2.total};
  });
  const bars=i=>({f:el.children[i].querySelector('.fill'),s:el.children[i].querySelector('.sfill')});
  rows.forEach((r,i)=>{                       // etiketler her zaman anında

  if(grow){                                   // panel açılışında sıfırdan yükselsinler
    rows.forEach((r,i)=>{const b=bars(i);b.f.style.transform='scaleY(0)';b.s.style.transform='scaleY(0)'});

      }
    }
    renderRing();drawDietWeek();refreshNow();
    $('dietCount').textContent=(()=>{const t=dietTotals();return t[1]&&t[0]===t[1]?'Bugün tamam':''})();
    if(navigator.vibrate)navigator.vibrate(8);
    const t=dietTotals();
    if(t[1]&&t[0]===t[1])hearts(innerWidth/2,innerHeight*.42,'#8FD0B4');
    return;
  }
  const ed=e.target.closest('[data-meal]');
  if(ed){const m=S.diet.filter(x=>x.id===ed.dataset.meal)[0];if(m)openMeal(m);return}
  /* biten öğünü aç/kapat */
  const sm=e.target.closest('[data-sum]');
  if(sm){const card=sm.closest('.meal');if(card)card.classList.toggle('open')}
});

/* öğün formu */
let mealEdit=null;
function drawMeal(){
  $('mSave').textContent=mealEdit?'Güncelle':'Kaydet';
  $('mDel').style.display=mealEdit?'':'none';
  $('mSave').disabled=!($('mName').value.trim()&&$('mItems').value.trim());
}
function openMeal(m){
  mealEdit=m?m.id:null;
  $('mName').value=m?m.name:'';
  $('mTime').value=m?m.time:'08:00';
  $('mItems').value=m?m.items.join('\n'):'';
  drawMeal();show('sheetMeal');
}
$('mName').addEventListener('input',drawMeal);
$('mItems').addEventListener('input',drawMeal);
$('mSave').addEventListener('click',()=>{
  const items=$('mItems').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const data={name:$('mName').value.trim(),time:$('mTime').value||'08:00',items:items};
  if(mealEdit){
    const m=S.diet.filter(x=>x.id===mealEdit)[0];
    if(m){m.name=data.name;m.time=data.time;m.items=data.items}
    tlog('ogun_guncellendi',{ogunId:mealEdit,ad:data.name,saat:data.time,maddeSayisi:items.length});
  }else{
    S.diet.push(Object.assign({id:'g'+Date.now(),added:todayKey()},data));
    tlog('ogun_eklendi',{ad:data.name,saat:data.time,maddeSayisi:items.length,maddeler:items,
      toplamOgun:S.diet.length});
  }
  mealEdit=null;save();hide();setTimeout(()=>renderDiet(true),300);
});
$('mDel').addEventListener('click',()=>{
  const id=mealEdit,m=S.diet.filter(x=>x.id===id)[0],idx=S.diet.indexOf(m);
  if(!m)return;
  tlog('ogun_silindi',{ogunId:id,ad:m.name,maddeSayisi:m.items.length});
  S.diet=S.diet.filter(x=>x.id!==id);mealEdit=null;save();hide();
  setTimeout(()=>renderDiet(true),300);
  toast(m.name+' silindi',()=>{S.diet.splice(idx,0,m);save();renderDiet(true)});
});
$('btnAddMeal').addEventListener('click',()=>openMeal(null));

/* ---------------- su hedefi ---------------- */
const GLASS_MINI='<svg width="14" height="19" viewBox="0 0 20 26" aria-hidden="true"><path d="M3 3h14l-1.6 20a2 2 0 0 1-2 1.8H6.6a2 2 0 0 1-2-1.8z" fill="#AFD6F0" stroke="#7FB8E0" stroke-width="1.8" stroke-linejoin="round"/></svg>';
function drawGoal(){
  const g=goal();
  $('sGoalN').textContent=g;
  $('sMinus').disabled=g<=4;$('sPlus').disabled=g>=16;
  $('sPrev').innerHTML=new Array(g+1).join(GLASS_MINI);
}
/* anında kaydeder — ayrı bir onay düğmesi gerekmiyor */
function setGoal(step){
  const g=Math.min(16,Math.max(4,goal()+step));
  if(g===goal())return;
  tlog('su_hedefi',{onceki:goal(),yeni:g});
  S.settings.waterGoal=g;save();drawGoal();renderWater();
  if(navigator.vibrate)navigator.vibrate(8);
}
$('sMinus').addEventListener('click',()=>setGoal(-1));
$('sPlus').addEventListener('click',()=>setGoal(1));
$('btnSet').addEventListener('click',()=>{drawGoal();show('sheetSet')});

/* sekmeler */
let curTab='med',tabVia='dokunma';
function tab(which){
  if(which===curTab)return;
  tlog('sekme',{nereye:which,nereden:curTab,kaynak:tabVia});tabVia='dokunma';
  const med=which==='med';
  const inEl=med?$('pgMed'):$('pgDiet'), outEl=med?$('pgDiet'):$('pgMed');
  const dir=med?-1:1;                       // diyete geçerken sağdan, geri dönerken soldan
  inEl.style.setProperty('--x',(dir*8)+'%');
  outEl.style.setProperty('--x',(-dir*8)+'%');
  outEl.classList.remove('on');
  inEl.classList.add('on');
  $('tabMed').classList.toggle('on',med);
  $('tabDiet').classList.toggle('on',!med);
  $('tabMed').setAttribute('aria-pressed',med);
  $('tabDiet').setAttribute('aria-pressed',!med);
  $('tabInd').style.transform=med?'none':'translateX(44px)';
  curTab=which;
  if(navigator.vibrate)navigator.vibrate(6);
  if(med){
    syncScene();tween(scene.scale,PILL,520,x=>scene.scale=x);
    scene.alive=active?1:0;
    const el=$('water');el.style.animation='none';
    const f=$('foot');f.classList.remove('reveal-foot');void f.offsetWidth;f.classList.add('reveal-foot');
    const rs=document.querySelector('.ring svg');
    rs.style.animation='none';void rs.getBBox;rs.style.animation='fadeIn .5s ease .1s both';
  }else{
    tween(scene.scale,.02,420,x=>scene.scale=x);
    tween(scene.alive,0,300,x=>scene.alive=x);
    renderWater();renderDiet(true);
    const el=document.querySelector('.dsum');el.style.animation='none';void el.offsetWidth;
    el.style.animation='fadeUp .5s var(--ease-out) both';
  }
}
$('tabMed').addEventListener('click',()=>tab('med'));
$('tabDiet').addEventListener('click',()=>tab('diet'));
/* yana kaydırarak sekme değiştir — 42px'lik sekme düğmesine nişan almak zorunda kalma */
(function(){
  const wrap=document.querySelector('.pagewrap');
  let x0=null,y0=null,axis=null;
  wrap.addEventListener('touchstart',e=>{
    if(openId||e.touches.length>1){x0=null;return}
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;axis=null;
  },{passive:true});
  wrap.addEventListener('touchmove',e=>{
    if(x0===null)return;
    const dx=e.touches[0].clientX-x0,dy=e.touches[0].clientY-y0;
    if(!axis&&(Math.abs(dx)>10||Math.abs(dy)>10))axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
  },{passive:true});
  wrap.addEventListener('touchend',e=>{
    if(x0===null)return;
    const dx=e.changedTouches[0].clientX-x0;
    if(axis==='x'&&Math.abs(dx)>56){tabVia='kaydirma';tab(dx<0?'diet':'med')}
    x0=null;
  });
})();

/* paneli aşağı sürükleyerek kapat */
Array.prototype.forEach.call(document.querySelectorAll('.sheet'),s=>{
  let y0=null,dy=0;
  s.addEventListener('touchstart',e=>{
    if(s.scrollTop>0)return;
    y0=e.touches[0].clientY;dy=0;s.style.transition='none';
  },{passive:true});
  s.addEventListener('touchmove',e=>{
    if(y0===null)return;
    dy=e.touches[0].clientY-y0;
    if(dy>0)s.style.transform='translateY('+dy+'px)';
  },{passive:true});
  s.addEventListener('touchend',()=>{
    if(y0===null)return;
    s.style.transition='';s.style.transform='';
    if(dy>90)hide();
    y0=null;
  });
});

/* ana ekrana ekleme ipucu (iOS, tarayıcıdan açıldıysa) */

/* ---------------- başlat ---------------- */
$('btnAdd').innerHTML=ico.plusInk+'<span>İlaç ekle</span>';
$('btnList').innerHTML=ico.jar+'<span>İlaçlarım</span>';
$('btnSkip').innerHTML=ico.skip+'<span>Atla</span>';
$('btnAddMeal').innerHTML=ico.plusRose+'<span>Öğün ekle</span>';
$('tabMed').innerHTML=ico.pillTab;
$('tabDiet').innerHTML=ico.fork;
$('btnSet').innerHTML=ico.gear;
$('fAddTime').innerHTML=ico.plus;
load();renderWater();renderDiet(false);drawDial();bellState();
try{
  const all=doses();
  TELE.meta({ilacSayisi:S.meds.length,ogunSayisi:S.diet.length,suHedefi:goal(),
    bugunToplamDoz:all.length,bugunAlinan:all.filter(d=>isTaken(d.key)).length,
    seri:streak(),uyum7:adherence7(),
    bildirim:(('Notification'in window)?Notification.permission:'yok')});
  tlog('acilis',{ilacSayisi:S.meds.length,ogunSayisi:S.diet.length,bugunToplamDoz:all.length,
    saat:new Date().getHours(),haftaninGunu:new Date().getDay()});
}catch(e){}
if(initGL())requestAnimationFrame(frame);
scene.scale=.12;
tickClock();render(false,false);
function bootDone(){
  if(booted)return;booted=true;handoff=true;
  $('boot').classList.add('gone');
  scene.apart=0;
  /* kalp merkeze çekilirken kadran aynı noktadan açılmaya başlar —
     arka arkaya iki ayrı hareket yerine üst üste binen tek bir jest */
  tween(scene.scale,.10,380,x=>scene.scale=x,()=>{
    handoff=false;                       // nesne görünmez küçüklükteyken kalp hapa döner
    syncScene();                         // ...ve aynı anda kadranın merkezine geçer
    render(false,true);
    tween(.10,PILL,880,x=>scene.scale=x,null,EOUT);
  },EOUT);
  setTimeout(()=>{document.body.classList.add('ready');playReveal(true,true)},190);
  setTimeout(()=>{const b=$('boot');if(b)b.remove()},1100);
}
$('boot').classList.add('play');
const bootStart=performance.now();
/* hareket azaltma açıksa sekansı bekletmenin anlamı yok */
const slow=!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const HOLD=slow?1600:350;
/* açılış sahnesi: 3B kalp, iki yarım ekranın dışından dönerek gelip birleşir */
scene.shape=3;scene.col=hex2rgb('#EF7FA6');scene.alive=1;scene.split=0;scene.scale=HEART;
scene.apart=slow?1:0;
/* hızlı başlayıp buluşmaya doğru yavaşlar */
/* kadranın çizilmesiyle aynı süre ve aynı eğri — iki sekans birbirini yankılar */
if(slow)tween(1,0,1200,x=>scene.apart=x,()=>{scene.glow=1},EOUT);
const finishBoot=()=>setTimeout(bootDone,Math.max(0,HOLD-(performance.now()-bootStart)));
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(finishBoot);setTimeout(finishBoot,1200)}
else finishBoot();
lastMin=new Date().getMinutes();
setInterval(()=>{
  tickClock();checkNotify();
  const d=new Date();
  if(keyOf(d)!==lastDay){                                    // gece yarısı sıfırlama
    lastDay=keyOf(d);manual=null;
    renderWater();renderDiet(false);                         // diyet sekmesi de dünde kalmasın
  }
  if(d.getMinutes()!==lastMin){lastMin=d.getMinutes();if(!openId)render()}
},1000);
const appEl=document.querySelector('.app');
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){appEl.classList.add('leaving')}
  else{appEl.classList.remove('leaving');tickClock();playReveal(false)}
});
addEventListener('pagehide',()=>appEl.classList.add('leaving'));
