<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="İlaç">
<meta name="theme-color" content="#FFEFF5">
<title>İlaç</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
<style>
/* Hallmark · macrostructure: Workbench · genre: playful · tone: soft
 * theme: custom (brand-preserved) · paper oklch(95% 0.03 350) · accent oklch(52% 0.16 359)
 * pre-emit critique: P4 H5 E5 S5 R4 V4
 * pass: redesign — contrast ramp, 44px targets, named primary action, 320px safety
 */
:root{
  --bg:#FFEFF5;
  --plum:#5A2C46;
  /* metin için: .78 alfa ≈ 5.26:1 zemin üstünde (WCAG AA) */
  --soft:rgba(90,44,70,.78);
  /* yalnız çizgi/dolgu — metin değil */
  --faint:rgba(90,44,70,.12);
  --hair:rgba(90,44,70,.08);
  --rose:#F08AAE;
  --rose2:#FFB3CD;
  /* rose metin/odak için çok açık (2.1:1) — koyu eşi 5.2:1 */
  --rose-ink:#B03A63;
  --amber-ink:#9A5416;
  --mint:#8FD0B4;
  --card:rgba(255,255,255,.62);
  --cardline:rgba(255,255,255,.9);
  --pad:26px;
  --hit:44px;
}
@media (max-width:360px){:root{--pad:18px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow-y:hidden;overflow-x:clip}
body{background:var(--bg);color:var(--plum);font-family:"DM Sans",-apple-system,system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
/* içerik metni seçilebilir kalsın — yedek/not kopyalamak için */
.name,.sub,.note,.row .txt,.meal,.empty,input,textarea{-webkit-user-select:text;user-select:text}
/* 44px dokunma alanı, görsel boyutu büyütmeden */
.hit44{position:relative}
.hit44::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:var(--hit);height:var(--hit)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 18px) var(--pad) calc(env(safe-area-inset-bottom) + 22px)}

/* üst şerit — saat/tarih istiflenir, 320px'de taşmaz */
.top{display:flex;align-items:center;gap:10px;min-width:0}
.stamp{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.clock{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1.15}
.date{font-size:12px;color:var(--soft);white-space:nowrap}
/* ilerleme artık doz bağlamının yanında — üst şeritte değil */
.count{font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums;
  display:block;margin:0 0 10px;letter-spacing:.01em}
.count:empty{display:none}
.bell{width:var(--hit);height:var(--hit);flex:0 0 auto;border-radius:50%;border:1px solid var(--cardline);background:var(--card);
  display:grid;place-items:center;transition:transform .16s}
.bell:active{transform:scale(.86)}

/* kadran */
.ring{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);
  width:min(86vw,346px);height:min(86vw,346px);pointer-events:none}
.ring svg{width:100%;height:100%;overflow:visible;pointer-events:auto}
.night{fill:none;stroke:rgba(120,96,180,.11);stroke-width:17}
.track{fill:none;stroke:rgba(90,44,70,.1);stroke-width:1}
.elapsed{fill:none;stroke:rgba(240,138,174,.6);stroke-width:2.4;stroke-linecap:round}
.hlab{font-size:10.5px;font-weight:600;fill:rgba(90,44,70,.72);letter-spacing:.06em}
.dlab{font-size:11px;font-weight:700;fill:#5A2C46;letter-spacing:.02em}
.hand{stroke:var(--rose);stroke-width:1.8;stroke-linecap:round}
.handdot{fill:var(--rose)}
.bead{transition:r .4s cubic-bezier(.34,1.7,.5,1),fill .4s ease,opacity .35s ease,stroke-width .3s ease}
.late{animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{r:7;opacity:.5}70%,100%{r:15;opacity:0}}
.tap{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);
  width:min(50vw,200px);height:min(50vw,200px);border:0;background:none;border-radius:50%;z-index:2}

/* alt blok */
.foot{margin-top:auto;transition:opacity .26s,transform .26s}
.foot{will-change:transform,opacity}
.foot.swap{opacity:0;transform:translateY(12px) scale(.985)}
/* düz (roman) — eğik serif başlık hem okunurluğu düşürüyordu hem de bir yapay-zekâ klişesi */
.name{font-family:Fraunces,Georgia,serif;font-style:normal;font-weight:600;font-size:clamp(30px,9.5vw,42px);
  line-height:1.05;margin:0;letter-spacing:-.5px;overflow-wrap:anywhere;min-width:0}
.sub{margin:11px 0 0;display:flex;align-items:baseline;gap:11px;font-size:14px;color:var(--soft);flex-wrap:wrap}
.sub b{font-size:18px;font-weight:700;color:var(--rose-ink);font-variant-numeric:tabular-nums}

/* eylem çubuğu — birincil eylemin artık adı var */
.bar{display:flex;gap:10px;margin-top:20px;align-items:center}
.bar2{display:flex;gap:10px;margin-top:10px}
.btn{width:50px;height:50px;flex:0 0 auto;border-radius:16px;border:1px solid var(--cardline);background:var(--card);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;
  transition:transform .16s cubic-bezier(.34,1.56,.64,1)}
.btn:active{transform:scale(.86)}
.btn.key{border:0;background:linear-gradient(135deg,var(--rose),var(--rose-ink));box-shadow:0 10px 24px rgba(176,58,99,.28)}
/* birincil: "Aldım" — daha önce kadranın üstünde görünmez bir dairedeydi */
.take{flex:1 1 auto;min-width:0;height:54px;border:0;border-radius:999px;display:flex;align-items:center;
  justify-content:center;gap:9px;padding:0 18px;font-family:inherit;font-size:16.5px;font-weight:700;color:#fff;
  background:linear-gradient(120deg,var(--rose),var(--rose-ink));box-shadow:0 10px 26px rgba(176,58,99,.3);
  white-space:nowrap;transition:transform .16s cubic-bezier(.34,1.56,.64,1)}
.take:active{transform:scale(.97)}
.take:disabled{opacity:.34;box-shadow:none}
/* ikincil: metin etiketli — daha önce yalnız ikondu */
.lbl{flex:1 1 0;min-width:0;height:44px;border-radius:14px;border:1px solid var(--cardline);background:var(--card);
  display:flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;font-size:14px;
  font-weight:500;color:var(--plum);white-space:nowrap;transition:transform .16s cubic-bezier(.34,1.56,.64,1)}
.lbl:active{transform:scale(.94)}
.lbl svg{flex:0 0 auto}
.lbl.skip{flex:0 0 auto;height:54px;padding:0 20px;border-radius:999px;font-weight:700;color:var(--soft)}

/* toast */
.toast{position:fixed;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:8;
  display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;background:#fff;
  box-shadow:0 14px 34px rgba(90,44,70,.2);font-size:14.5px;font-weight:500;
  transform:translateY(160%);transition:transform .32s cubic-bezier(.4,0,.6,1)}
.toast.on{transform:translateY(0);transition:transform .5s cubic-bezier(.18,1.1,.3,1)}
.toast button{margin-left:auto;flex:0 0 auto;border:0;background:rgba(176,58,99,.12);color:var(--rose-ink);
  font-family:inherit;font-size:14px;font-weight:700;padding:0 18px;min-height:var(--hit);border-radius:999px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:5;background:rgba(90,44,70,.28);backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:.28s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#FFF6FA;border-radius:32px 32px 0 0;
  padding:12px 24px calc(env(safe-area-inset-bottom) + 26px);box-shadow:0 -18px 50px rgba(90,44,70,.15);
  transform:translateY(110%);transition:transform .34s cubic-bezier(.4,0,.6,1);max-height:88vh;overflow-y:auto;will-change:transform}
.sheet.open{transform:translateY(0);transition:transform .52s cubic-bezier(.18,1.06,.3,1)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--faint);margin:4px auto 20px}
.field{display:flex;gap:10px;margin-bottom:12px}
input[type=text],input[type=time]{flex:1;width:100%;font-family:inherit;font-size:16px;font-weight:500;color:var(--plum);
  background:#fff;border:1.5px solid rgba(90,44,70,.08);border-radius:16px;padding:15px 16px;outline:none}
input:focus{border-color:var(--rose2)}
input::placeholder{color:rgba(90,44,70,.3)}
.mini{width:52px;min-height:var(--hit);flex:0 0 auto;border-radius:16px;border:0;background:var(--rose-ink);display:grid;place-items:center}
.mini:active{transform:scale(.92)}
.picks{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pick{width:38px;height:38px;border-radius:50%;border:2.5px solid transparent;transition:.2s}
.pick.sel{border-color:var(--plum);transform:scale(1.12)}
.shape{width:56px;height:48px;border-radius:15px;border:1.5px solid var(--hair);background:#fff;display:grid;place-items:center}
.shape.sel{border-color:var(--plum);border-width:2.5px}
.days{display:flex;gap:6px;margin-bottom:18px}
.days button{flex:1;min-width:0;height:var(--hit);border-radius:13px;border:1.5px solid var(--hair);background:#fff;
  font-family:inherit;font-size:13.5px;font-weight:700;color:var(--soft);transition:.2s}
/* beyaz-üstü-açık-pembe 1.7:1 idi — mürekkep rengi 6.7:1 */
.days button.on{background:var(--rose2);border-color:var(--rose-ink);color:var(--plum)}
.days button:active{transform:scale(.92)}
.pair{display:flex;gap:10px;margin-bottom:12px}
.pair .save{margin:0}
.ghost{background:rgba(176,58,99,.12)!important;color:var(--rose-ink)!important;box-shadow:none!important}
.times{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--hair);
  border-radius:14px;padding:9px 10px 9px 13px;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.chip button{border:0;background:none;padding:0;display:grid;place-items:center}
/* beyaz-üstü-açık-pembe 2.4:1 idi — mürekkep ucu 5.8:1 */
.save{width:100%;border:0;border-radius:999px;padding:18px;font-family:inherit;font-size:16px;font-weight:700;color:#fff;
  background:linear-gradient(120deg,var(--rose),var(--rose-ink));transition:transform .16s}
.save:active{transform:scale(.97)}
.save:disabled{opacity:.3}
.row{display:flex;align-items:center;gap:13px;padding:12px;border-radius:18px;background:#fff;margin-bottom:10px;
  border:1.5px solid rgba(90,44,70,.05);transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.row:active{transform:scale(.985);box-shadow:0 6px 16px rgba(90,44,70,.08)}
.row .txt{flex:1;min-width:0}
.row b{display:block;font-size:16px;font-weight:500}
.row small{color:var(--soft);font-size:12.5px;font-variant-numeric:tabular-nums;letter-spacing:.05em}
.empty{text-align:center;color:var(--soft);font-size:14px;padding:24px 0 14px}
.week{display:flex;gap:7px;margin-bottom:20px}
.week i{flex:1;text-align:center;font-style:normal}
.week .col{height:44px;border-radius:9px;background:rgba(90,44,70,.07);position:relative;overflow:hidden;margin-bottom:6px}
.week .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--rose2),var(--rose));border-radius:9px}
.week span{font-size:10.5px;color:var(--soft)}
.hd{font-size:13px;font-weight:700;color:var(--soft);margin:0 0 12px;letter-spacing:.02em}

/* açılış perdesi — uygulamayla aynı zemin, sessizce erir */
#boot{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  background:var(--bg);transition:opacity .55s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot .cap{animation:capIn .75s cubic-bezier(.34,1.56,.64,1) both,capBob 2.6s ease-in-out .75s infinite}
@keyframes capIn{0%{opacity:0;transform:scale(.5) rotate(-26deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes capBob{0%,100%{transform:translateY(-3px) rotate(-5deg)}50%{transform:translateY(3px) rotate(5deg)}}
#boot .dots{display:flex;gap:8px}
#boot .dots i{width:7px;height:7px;border-radius:50%;background:var(--rose2);animation:dotWave 1.15s ease-in-out infinite}
@keyframes dotWave{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-7px);opacity:1}}

/* giriş hareketleri */
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.2)}65%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:792}to{stroke-dashoffset:0}}
@keyframes ripple{0%{transform:scale(.86);opacity:.9}100%{transform:scale(1.28);opacity:0}}
@keyframes leave{to{opacity:0;transform:scale(.97) translateY(12px)}}
.reveal-top{animation:fadeDown .6s ease both}
.reveal-foot{animation:fadeUp .75s cubic-bezier(.2,.7,.3,1) both}
.track.draw{stroke-dasharray:792;animation:draw 1s cubic-bezier(.4,0,.2,1) both}
circle.bead,text.dlab,circle.ripplering{transform-box:fill-box;transform-origin:center}
.app.leaving{animation:leave .4s ease forwards}

/* sayfalar */
.pagewrap{position:relative;flex:1;min-height:0;margin-top:14px}
.page{position:absolute;inset:0;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transform:translateX(var(--x,8%)) scale(.985);will-change:transform,opacity;
  transition:opacity .26s ease,transform .46s cubic-bezier(.22,1,.3,1)}
.page.on{opacity:1;transform:none;pointer-events:auto;transition:opacity .3s ease .06s,transform .5s cubic-bezier(.22,1.1,.3,1)}
.tabs{position:relative;display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--card);border:1px solid var(--cardline);flex:0 0 auto}
.tabs .ind{position:absolute;top:3px;left:3px;width:42px;height:40px;border-radius:999px;background:#fff;
  box-shadow:0 4px 12px rgba(90,44,70,.1);transition:transform .42s cubic-bezier(.22,1.3,.3,1)}
.tabs button{position:relative;z-index:1;width:42px;height:40px;border:0;border-radius:999px;background:none;
  display:grid;place-items:center;opacity:.55;transition:opacity .28s ease,transform .28s cubic-bezier(.34,1.56,.64,1)}
.tabs button.on{opacity:1}
.tabs button:active{transform:scale(.9)}
#water{animation:fadeUp .45s cubic-bezier(.2,.7,.3,1) both}

/* diyet */
/* 16 bardak hedefinde tek satır 320px'i taşırıyordu — artık sarıyor */
.water{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.water button{border:0;background:none;padding:0;width:40px;height:var(--hit);display:grid;place-items:center;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.water button:active{transform:scale(.85)}
.hint{margin-left:auto;align-self:center;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.water .wl{flex:1 0 100%;margin:2px 0 0;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.meals{flex:1;min-height:0;overflow-y:auto;padding-right:2px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(180deg,#000 90%,transparent)}
.meals::-webkit-scrollbar{display:none}
textarea{width:100%;font-family:inherit;font-size:16px;font-weight:500;color:var(--plum);line-height:1.5;
  background:#fff;border:1.5px solid rgba(90,44,70,.08);border-radius:16px;padding:14px 16px;outline:none;
  min-height:110px;resize:none;margin-bottom:12px}
textarea:focus{border-color:var(--rose2)}
.del{width:100%;border:0;border-radius:999px;padding:15px;margin-top:10px;font-family:inherit;font-size:15px;
  font-weight:700;color:var(--rose-ink);background:rgba(176,58,99,.12)}

.meal{background:#fff;border:1.5px solid rgba(90,44,70,.05);border-radius:22px;padding:14px 16px 12px;margin-bottom:12px;
  box-shadow:0 6px 18px rgba(90,44,70,.05)}
.meal h3{margin:0 0 6px;font-size:15.5px;font-weight:700;display:flex;align-items:baseline;gap:10px}
.meal h3 em{font-style:normal;font-size:13px;font-weight:500;color:var(--soft);font-variant-numeric:tabular-nums}
.meal h3 button{margin-left:auto;flex:0 0 auto;border:0;background:none;width:var(--hit);height:36px;display:grid;place-items:center}
.food{display:flex;align-items:center;gap:11px;padding:5px 0;font-size:15.5px;transition:opacity .25s,color .25s}
.food span{transition:text-decoration-color .25s;min-width:0;overflow-wrap:anywhere}
.food .c{transition:background .25s,border-color .25s,transform .18s cubic-bezier(.34,1.56,.64,1)}
.food .c{width:30px;height:30px;flex:0 0 auto;border-radius:50%;border:2px solid var(--faint);background:none;display:grid;place-items:center;position:relative}
.food .c::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--hit);height:var(--hit)}
.food .c:active{transform:scale(.85)}
.food.ok{color:var(--soft)}
.food.ok span{text-decoration:line-through}
.food.ok .c{background:rgba(143,208,180,.22);border-color:transparent}
.mbar{height:4px;border-radius:2px;background:rgba(90,44,70,.07);margin-top:8px;overflow:hidden}
.mbar i{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,var(--rose2),var(--rose));transition:width .45s cubic-bezier(.32,.72,0,1)}

:focus-visible{outline:3px solid var(--rose-ink);outline-offset:3px;border-radius:12px}
input[type=number]{flex:1;width:100%;font-family:inherit;font-size:16px;font-weight:500;color:var(--plum);
  background:#fff;border:1.5px solid rgba(90,44,70,.08);border-radius:16px;padding:15px 16px;outline:none;-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.name{text-shadow:0 2px 22px rgba(255,255,255,.55)}
.note{margin:8px 0 0;font-size:13.5px;color:var(--soft);font-style:italic}
.nudge{animation:nudge 2.6s ease-in-out infinite}
@keyframes nudge{0%,88%,100%{transform:none}92%{transform:scale(1.1)}96%{transform:scale(.96)}}
.tag{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;
  background:rgba(176,58,99,.12);color:var(--rose-ink);vertical-align:2px}
.tag.low{background:rgba(154,84,22,.14);color:var(--amber-ink)}
.hdrow{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
.hdrow b{font-size:13px;font-weight:700;color:var(--soft)}
.hdrow span{font-size:12.5px;color:var(--rose);font-weight:700}
#a2hs{position:fixed;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:7;
  display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:20px;background:#fff;
  box-shadow:0 14px 34px rgba(90,44,70,.16);font-size:13.5px;color:var(--soft);
  transform:translateY(140%);transition:transform .45s cubic-bezier(.32,.72,0,1)}
#a2hs.on{transform:translateY(0)}
#a2hs button{margin-left:auto;border:0;background:none;padding:4px;display:grid;place-items:center}

.bit{position:fixed;z-index:9;pointer-events:none;animation:fly 1.2s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.35);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.05);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="boot">
  <svg class="cap" width="74" height="74" viewBox="0 0 100 100" style="transform-box:fill-box;transform-origin:center">
    <g transform="rotate(-38 50 50)">
      <rect x="38" y="24" width="24" height="52" rx="12" fill="#FFB3CD"/>
      <path d="M38 50h24v14a12 12 0 0 1-24 0z" fill="rgba(0,0,0,.1)"/>
      <rect x="43.5" y="31" width="4.6" height="14" rx="2.3" fill="#fff" opacity=".6"/>
    </g>
  </svg>
  <span class="dots"><i></i><i style="animation-delay:.15s"></i><i style="animation-delay:.3s"></i></span>
</div>

<div class="app">

<script id="fs" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 u_res;
uniform float u_time,u_split,u_alive,u_glow,u_shape,u_scale;
uniform vec3 u_col;

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float hash(vec3 p){return fract(sin(dot(p,vec3(21.98,78.23,45.17)))*43758.5453);}
float blob(vec2 p,vec2 c,float r){float d=length(p-c)/r;return exp(-d*d);}

float sdCapsule(vec3 p,float h,float r){p.y-=clamp(p.y,-h,h);return length(p)-r;}
float sdTablet(vec3 p){
  float ra=.34,rb=.07,h=.08;
  vec2 d=vec2(length(p.xz)-ra+rb, abs(p.y)-h);
  return min(max(d.x,d.y),0.)+length(max(d,vec2(0.)))-rb;
}
float sdEllipsoid(vec3 p,vec3 r){
  float k0=length(p/r);
  float k1=max(length(p/(r*r)),1e-4);
  return k0*(k0-1.)/k1;
}
float body(vec3 p){
  if(u_shape<.5)  return sdCapsule(p,.22,.25);
  if(u_shape<1.5) return sdTablet(p);
  return sdEllipsoid(p,vec3(.22,.30,.22));
}
vec3 axis(){return (u_shape>.5&&u_shape<1.5)?vec3(1.,0.,0.):vec3(0.,1.,0.);}
vec2 map(vec3 p){
  p/=max(u_scale,.05);
  p.y-=sin(u_time*.55)*.04;
  p.xz*=rot(u_time*.22);
  p.xy*=rot(-.36+sin(u_time*.34)*.06);
  vec3 ax=axis();
  float s=u_split*.38;
  vec3 pa=p-ax*s; pa.xy*=rot(-u_split*.28);
  float da=max(body(pa),-dot(pa,ax));
  vec3 pb=p+ax*s; pb.xy*=rot(u_split*.28);
  float db=max(body(pb), dot(pb,ax));
  float sc=max(u_scale,.05);
  return da<db?vec2(da*sc,1.):vec2(db*sc,2.);
}
vec3 nrm(vec3 p){
  vec2 e=vec2(.0015,0.);
  return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,
                        map(p+e.yxy).x-map(p-e.yxy).x,
                        map(p+e.yyx).x-map(p-e.yyx).x));
}
vec3 amb(vec2 q){
  float t=u_time*.1;
  vec3 c=mix(vec3(1.,.957,.973),vec3(1.,.898,.937),q.y*.5+.5);
  c=mix(c,vec3(1.,.796,.867),clamp(blob(q,vec2(sin(t*1.1)*.42-.22,cos(t*.9)*.34+.40),.66),0.,1.)*.68);
  c=mix(c,vec3(1.,.867,.808),clamp(blob(q,vec2(cos(t*.8)*.46+.34,sin(t*1.2)*.36-.30),.58),0.,1.)*.52);
  c=mix(c,vec3(.918,.867,1.),clamp(blob(q,vec2(sin(t*.6)*.55,cos(t*.7)*.45-.52),.5),0.,1.)*.44);
  c=mix(c,u_col,clamp(blob(q,vec2(cos(t*1.3)*.3-.36,sin(t*.5)*.28+.02),.42),0.,1.)*.2);
  return c;
}
vec3 ambDir(vec3 d){return amb(d.xy*1.15);}

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*u_res)/u_res.y;
  uv.y-=.05;
  vec3 col=amb(uv);
  col*=1.-.15*exp(-length((uv-vec2(0.,-.42))*vec2(1.5,4.0))*2.2)*u_alive;

  vec3 ro=vec3(0.,0.,3.0);
  vec3 rd=normalize(vec3(uv,-1.95));
  float t=0.,hit=0.,mid=0.;
  if(u_alive>.02){
    for(int i=0;i<70;i++){
      vec3 p=ro+rd*t;
      vec2 d=map(p);
      if(d.x<.0018){hit=1.;mid=d.y;break;}
      t+=d.x*.85;
      if(t>6.)break;
    }
  }
  if(hit>.5){
    vec3 p=ro+rd*t;
    vec3 n=nrm(p);
    vec3 l1=normalize(vec3(.45,.85,.7)),l2=normalize(vec3(-.6,.2,.5));
    float fres=.03+.97*pow(1.-clamp(dot(n,-rd),0.,1.),4.5);
    vec3 rr=refract(rd,n,1./1.42);
    vec3 ip=p+rr*.02; float th=0.;
    for(int j=0;j<16;j++){
      float d=-map(ip).x;
      if(d<.0028)break;
      ip+=rr*d; th+=d;
    }
    vec3 en=nrm(ip);
    vec3 ex=refract(rr,-en,1.42);
    if(dot(ex,ex)<.001)ex=rr;
    vec3 tint=exp(-(1.-u_col)*th*(mid<1.5?2.3:1.5));
    vec3 trans=ambDir(ex)*tint;
    float grain=step(.96,hash(floor(ip*24.)));
    trans=mix(trans,u_col,grain*.12);
    float dif=clamp(dot(n,l1),0.,1.);
    float spe=pow(clamp(dot(reflect(-l1,n),-rd),0.,1.),80.)*.5
             +pow(clamp(dot(reflect(-l2,n),-rd),0.,1.),36.)*.14;
    vec3 sur=mix(trans,ambDir(reflect(rd,n)),fres*.45);
    sur=mix(sur,vec3(1.),fres*.18);
    sur+=u_col*dif*.06;
    sur+=vec3(1.)*spe;
    col=mix(col,sur,u_alive);
  }
  col=mix(col,mix(col,u_col,.5),u_glow*.25*exp(-length(uv)*2.2));
  col+=(hash(vec3(gl_FragCoord.xy,fract(u_time)))-.5)*.008;
  gl_FragColor=vec4(clamp(col,0.,1.),1.);
}
</script>

<script>
/* ---------------- veri ---------------- */
const COLORS=['#FFB3CD','#FFC9A8','#D9C2F5','#A8E0C6','#AFD6F0','#FFE0A8'];
const SHAPES=['capsule','tablet','drop'];
const DAYS=['Pzr','Pzt','Sal','Çar','Per','Cum','Cmt'];
const MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const S={meds:[],taken:{},skipped:{},diet:[],eaten:{},water:{},settings:{waterGoal:8}};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayKey=()=>keyOf(new Date());
const mins=t=>parseInt(t.slice(0,2),10)*60+parseInt(t.slice(3,5),10);
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};

function load(){
  try{const r=localStorage.getItem('ilac.v7');if(r){const p=JSON.parse(r);S.meds=p.meds||[];S.taken=p.taken||{};S.skipped=p.skipped||{};S.diet=p.diet||[];S.eaten=p.eaten||{};S.water=p.water||{};S.settings=Object.assign({waterGoal:8},p.settings||{})}}catch(e){}
  if(!S.meds.length)S.meds=[
    {id:'d1',name:'Vitamin D',times:['09:00'],color:'#FFE0A8',shape:'drop'},
    {id:'d2',name:'Demir',times:['13:00','21:00'],color:'#FFB3CD',shape:'capsule'},
    {id:'d3',name:'Magnezyum',times:['22:30'],color:'#A8E0C6',shape:'tablet'}];
  // 30 günden eski kayıtları temizle
  const cut=new Date();cut.setDate(cut.getDate()-30);const c=keyOf(cut);
  Object.keys(S.taken).forEach(k=>{if(k<c)delete S.taken[k]});
  Object.keys(S.skipped).forEach(k=>{if(k<c)delete S.skipped[k]});
  Object.keys(S.eaten).forEach(k=>{if(k<c)delete S.eaten[k]});
  Object.keys(S.water).forEach(k=>{if(k<c)delete S.water[k]});
}
const save=()=>{try{localStorage.setItem('ilac.v7',JSON.stringify(S))}catch(e){}};
const DAYNAMES=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
/* tek harf üç "P" ve iki "C" üretiyordu — iki harf ayırt edilebilir */
const DAY2=['Pa','Pt','Sa','Ça','Pe','Cu','Ct'];
const DAYORDER=[1,2,3,4,5,6,0];
const activeOn=(m,dt)=>!m.days||!m.days.length||m.days.indexOf(dt.getDay())>=0;
function dosesFor(dt){
  const o=[];
  S.meds.forEach(m=>{if(activeOn(m,dt))m.times.forEach(t=>o.push({key:m.id+'@'+t,med:m,time:t}))});
  return o.sort((a,b)=>mins(a.time)-mins(b.time));
}
function doses(){return dosesFor(new Date())}
const isTaken=k=>(S.taken[todayKey()]||[]).indexOf(k)>=0;
const isSkipped=k=>(S.skipped[todayKey()]||[]).indexOf(k)>=0;
const isDone=k=>isTaken(k)||isSkipped(k);
function streak(){
  if(!S.meds.length)return 0;
  const done=dt=>{
    const total=dosesFor(dt).length;
    if(!total)return true;                       // o gün ilaç yoksa seri bozulmaz
    const k=keyOf(dt);
    return ((S.taken[k]||[]).length+(S.skipped[k]||[]).length)>=total;
  };
  const d=new Date();let n=0;
  if(!done(d))d.setDate(d.getDate()-1);
  while(done(d)&&n<400){if(dosesFor(d).length)n++;d.setDate(d.getDate()-1)}
  return n;
}
function nextDose(){
  const left=doses().filter(d=>!isDone(d.key));
  if(!left.length)return null;
  const n=nowMin();
  return left.filter(d=>mins(d.time)<=n).pop()||left[0];
}
function when(t){
  const d=mins(t)-nowMin();
  if(d<-90)return Math.round(-d/60)+' saattir bekliyor';
  if(d<-1)return -d+' dakikadır bekliyor';
  if(d<=1)return 'tam zamanı';
  if(d<60)return d+' dakika sonra';
  const h=Math.floor(d/60),m=d%60;
  return h+' saat'+(m?' '+m+' dakika':'')+' sonra';
}
const isLate=d=>!isDone(d.key)&&nowMin()-mins(d.time)>10;

/* ---------------- WebGL ---------------- */
const cv=$('gl');
const gl=cv.getContext('webgl',{antialias:false,alpha:false})||cv.getContext('experimental-webgl');
const U={};const scene={split:0,alive:1,glow:0,shape:0,scale:1,col:[1,.7,.8]};
function sh(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.warn(gl.getShaderInfoLog(s));return s}
function initGL(){
  if(!gl){document.body.style.background='radial-gradient(120% 70% at 30% 25%,#FFDCEA,#FFEFF5)';return false}
  const p=gl.createProgram();
  gl.attachShader(p,sh(gl.VERTEX_SHADER,$('vs').textContent));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,$('fs').textContent));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){console.warn(gl.getProgramInfoLog(p));return false}
  gl.useProgram(p);
  const b=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const a=gl.getAttribLocation(p,'a');
  gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
  ['u_res','u_time','u_split','u_alive','u_glow','u_shape','u_scale','u_col'].forEach(n=>U[n]=gl.getUniformLocation(p,n));
  resize();return true;
}
function resize(){
  if(!gl)return;
  const d=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.floor(innerWidth*d);cv.height=Math.floor(innerHeight*d);
  gl.viewport(0,0,cv.width,cv.height);gl.uniform2f(U.u_res,cv.width,cv.height);
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,220));
const hex2rgb=h=>[parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255];
const t0=performance.now();
function frame(now){
  if(gl){
    scene.glow*=.94;
    gl.uniform1f(U.u_time,(now-t0)/1000);
    gl.uniform1f(U.u_split,scene.split);
    gl.uniform1f(U.u_alive,scene.alive);
    gl.uniform1f(U.u_glow,scene.glow);
    gl.uniform1f(U.u_shape,scene.shape);
    gl.uniform1f(U.u_scale,scene.scale);
    gl.uniform3f(U.u_col,scene.col[0],scene.col[1],scene.col[2]);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  requestAnimationFrame(frame);
}
function tween(a,b,ms,set,end){
  const st=performance.now();
  (function s(n){
    const k=Math.min(1,(n-st)/ms);
    const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    set(a+(b-a)*e);
    if(k<1)requestAnimationFrame(s);else if(end)end();
  })(st);
}

}

const esc=s=>String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

/* ---------------- kadran ----------------
   00:00 tepe · 06:00 sağ · 12:00 alt · 18:00 sol */
const R=126, CIRC=2*Math.PI*R, NS='http://www.w3.org/2000/svg';
function pt(m,r){const a=(m/1440)*Math.PI*2-Math.PI/2;return[150+Math.cos(a)*r,150+Math.sin(a)*r]}
function drawDial(){
  // gece bandı 21:00 → 06:00
  const nightLen=((360-1260+1440)%1440)/1440*CIRC;
  $('night').setAttribute('stroke-dasharray',nightLen.toFixed(1)+' '+(CIRC-nightLen).toFixed(1));
  $('night').setAttribute('stroke-dashoffset',(-(1260/1440)*CIRC).toFixed(1));

  let s='';
  for(let h=0;h<24;h++){
    const [x1,y1]=pt(h*60,R-(h%3?3:7)),[x2,y2]=pt(h*60,R);
    s+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="rgba(90,44,70,${h%3?.12:.28})" stroke-width="${h%3?1:1.5}"/>`;
  }
  $('ticks').innerHTML=s;

  let l='';
  for(let h=0;h<24;h+=3){
    const [x,y]=pt(h*60,R+18);
    l+=`<text class="hlab" x="${x.toFixed(1)}" y="${(y+3.4).toFixed(1)}" text-anchor="middle">${pad(h)}</text>`;
  }
  $('labels').innerHTML=l;

  // ay (gece yarısı) ve güneş (öğle)
  const [mx,my]=pt(0,R-24),[sx,sy]=pt(720,R-24);
  let g=`<g opacity=".4"><path d="M${(mx+3).toFixed(1)} ${(my-5).toFixed(1)}a5.6 5.6 0 1 0 0 10 6.8 6.8 0 0 1 0-10z" fill="#7B62B4"/></g>
    <g opacity=".45" transform="translate(${sx.toFixed(1)} ${sy.toFixed(1)})"><circle r="3.6" fill="#E8A65C"/>`;
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    g+=`<line x1="${(Math.cos(a)*5.4).toFixed(1)}" y1="${(Math.sin(a)*5.4).toFixed(1)}" x2="${(Math.cos(a)*7.4).toFixed(1)}" y2="${(Math.sin(a)*7.4).toFixed(1)}" stroke="#E8A65C" stroke-width="1.3" stroke-linecap="round"/>`;
  }
  $('glyphs').innerHTML=g+'</g>';
}
const nowMinF=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60};
let handLock=false;
function drawHand(n){
  $('elapsed').setAttribute('stroke-dasharray',(CIRC*n/1440).toFixed(2)+' '+CIRC.toFixed(2));
  const [x1,y1]=pt(n,R-13),[x2,y2]=pt(n,R+8);
  $('hand').innerHTML=`<line class="hand" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>
    <circle class="handdot" cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="3"/>`;
}
function tickClock(){
  const d=new Date();
  $('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes());
  $('date').textContent=DAYS[d.getDay()]+', '+d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3);
  if(!handLock)drawHand(nowMinF());
}
/* ibre gece yarısından şu ana süzülerek gelir */
function sweepHand(ms){
  handLock=true;
  const to=nowMinF(),st=performance.now();
  (function s(t){
    const k=Math.min(1,(t-st)/ms);
    drawHand(to*(1-Math.pow(1-k,3)));
    if(k<1)requestAnimationFrame(s);else handLock=false;
  })(st);
}
/* açılış / geri dönüş sekansı */
function playReveal(full){
  const top=document.querySelector('.top'),foot=$('foot'),track=document.querySelector('.track');
  [[top,'reveal-top'],[foot,'reveal-foot']].forEach(function(pair){
    pair[0].classList.remove(pair[1]);void pair[0].offsetWidth;pair[0].classList.add(pair[1]);
  });
  ['ticks','labels','glyphs'].forEach((id,i)=>{
    const el=$(id);el.style.animation='none';void el.getBBox;
    el.style.animation='fadeIn .8s ease '+(i*130+(full?260:60))+'ms both';
  });
  if(full){track.classList.remove('draw');void track.getBBox;track.classList.add('draw')}
  render(false,true);
  sweepHand(full?1200:650);
  scene.scale=.12;
  tween(.12,1,full?950:600,x=>scene.scale=x);
}
/* gün tamamlandığında kapanış */
function playFinale(){
  const svg=document.querySelector('.ring svg');
  const c=document.createElementNS(NS,'circle');
  c.setAttribute('class','ripplering');c.setAttribute('cx',150);c.setAttribute('cy',150);c.setAttribute('r',126);
  c.setAttribute('fill','none');c.setAttribute('stroke','#8FD0B4');c.setAttribute('stroke-width',3);
  c.style.animation='ripple 1.2s ease-out forwards';
  svg.appendChild(c);setTimeout(()=>c.remove(),1300);
  hearts(innerWidth/2,innerHeight*.45,'#8FD0B4');
  setTimeout(()=>hearts(innerWidth/2,innerHeight*.45,'#FFB3CD'),280);
  const foot=$('foot');
  foot.classList.remove('reveal-foot');void foot.offsetWidth;foot.classList.add('reveal-foot');
}

/* ---------------- ekran ---------------- */
let active=null,manual=null,lastMin=-1,lastDay=todayKey();
function render(swap,animate){
  const all=doses();
  const cur=(manual&&!isDone(manual.key))?manual:nextDose();
  active=cur;

  const g=$('beads');g.innerHTML='';
  all.forEach((d,i)=>{
    const [x,y]=pt(mins(d.time),R);
    const tk=isTaken(d.key),sk=isSkipped(d.key),sel=cur&&cur.key===d.key;
    if(!tk&&isLate(d)){
      const ping=document.createElementNS(NS,'circle');
      ping.setAttribute('class','late');ping.setAttribute('cx',x.toFixed(1));ping.setAttribute('cy',y.toFixed(1));
      ping.setAttribute('r',7);ping.setAttribute('fill','none');
      ping.setAttribute('stroke',d.med.color);ping.setAttribute('stroke-width',2);
      g.appendChild(ping);
    }
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('class','bead');c.setAttribute('cx',x.toFixed(1));c.setAttribute('cy',y.toFixed(1));
    c.setAttribute('r',sel?7.5:5);
    c.setAttribute('fill',tk?'#8FD0B4':(sk?'rgba(90,44,70,.22)':d.med.color));
    c.setAttribute('stroke','#fff');c.setAttribute('stroke-width',sel?2.6:2);
    c.setAttribute('opacity',tk?.6:(sk?.5:1));
    if(animate){c.style.animation='pop .55s cubic-bezier(.34,1.56,.64,1) both';c.style.animationDelay=(i*70)+'ms'}
    g.appendChild(c);
    if(sel){
      const [lx,ly]=pt(mins(d.time),R-26);
      const tx=document.createElementNS(NS,'text');
      tx.setAttribute('class','dlab');tx.setAttribute('x',lx.toFixed(1));tx.setAttribute('y',(ly+4).toFixed(1));
      tx.setAttribute('text-anchor','middle');tx.textContent=d.time;
      tx.style.animation='pop .5s cubic-bezier(.34,1.56,.64,1) '+(animate?(all.length*70+80):0)+'ms both';
      g.appendChild(tx);
    }
    const hit=document.createElementNS(NS,'circle');
    hit.setAttribute('cx',x.toFixed(1));hit.setAttribute('cy',y.toFixed(1));hit.setAttribute('r',17);
    hit.setAttribute('fill','transparent');hit.style.cursor='pointer';
    hit.addEventListener('click',()=>{if(!isDone(d.key)){manual=d;render(true)}});
    g.appendChild(hit);
  });

  const write=()=>{
    if(cur){
      $('nName').textContent=cur.med.name;
      $('nSub').innerHTML='<b>'+cur.time+'</b><span>'+when(cur.time)+'</span>';
      $('nNote').textContent=cur.med.note||'';
      $('btnSkip').style.display='';
      $('btnTake').disabled=false;
      scene.col=hex2rgb(cur.med.color);
      scene.shape=Math.max(0,SHAPES.indexOf(cur.med.shape));
      scene.alive=1;scene.split=0;
    }else{
      $('nName').textContent=all.length?'Bugünlük bitti':'Liste boş';
      $('nSub').innerHTML='<span>'+(all.length?'yarın sabah görüşürüz':'artıya dokunup ilk ilacını ekle')+'</span>';
      $('nNote').textContent='';
      $('btnSkip').style.display='none';
      $('btnTake').disabled=true;
      scene.alive=0;
    }
    const skn=all.filter(d=>isSkipped(d.key)).length;
    $('count').textContent=all.length?(all.filter(d=>isTaken(d.key)).length+' / '+all.length+' alındı'+(skn?' · '+skn+' atlandı':'')):'';
    $('btnAdd').classList.toggle('nudge',!all.length);
  };
  if(swap){$('foot').classList.add('swap');setTimeout(()=>{write();$('foot').classList.remove('swap')},180)}
  else write();
}

/* ---------------- aldım + geri al ---------------- */
let toastTimer=null,undoFn=null;
function toast(msg,fn,label){
  $('toastMsg').textContent=msg;
  undoFn=fn;
  $('toastBtn').textContent=label||'Geri al';
  $('toastBtn').style.display=fn?'':'none';
  $('toast').classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$('toast').classList.remove('on'),5000);
}
$('toastBtn').addEventListener('click',()=>{
  if(undoFn)undoFn();
  undoFn=null;$('toast').classList.remove('on');
});
/* hem kadrana dokunma hem de adı yazan "Aldım" düğmesi buraya bağlanır */
function takeDose(px,py){
  if(!active)return;
  const d=active,k=todayKey();
  manual=null;scene.glow=1;
  if(navigator.vibrate)navigator.vibrate([10,30,14]);
  hearts(px||innerWidth/2,py||innerHeight*.45,d.med.color);
  tween(0,1,600,x=>scene.split=x,()=>tween(1,0,320,x=>scene.alive=x,()=>{
    S.taken[k]=(S.taken[k]||[]).concat([d.key]);
    const hadStock=typeof d.med.stock==='number';
    if(hadStock&&d.med.stock>0)d.med.stock--;
    save();render(true);
    if(!nextDose())setTimeout(playFinale,120);
    toast(d.med.name+' alındı',()=>{
      S.taken[k]=(S.taken[k]||[]).filter(x=>x!==d.key);
      if(hadStock)d.med.stock++;
      save();render(true);
    });
    if(hadStock&&d.med.stock<=5)setTimeout(()=>toast(d.med.name+' azalıyor — '+d.med.stock+' doz kaldı'),5300);
  }));
}
$('tap').addEventListener('click',e=>takeDose(e.clientX,e.clientY));
$('btnTake').addEventListener('click',()=>takeDose(innerWidth/2,innerHeight*.45));
function hearts(x,y,color){
  for(let i=0;i<12;i++){
    const el=document.createElement('span'),z=10+Math.random()*12,a=Math.random()*Math.PI*2,r=55+Math.random()*105;
    el.className='bit';
    el.style.cssText='left:'+(x-z/2)+'px;top:'+(y-z/2)+'px;--dx:'+(Math.cos(a)*r).toFixed(0)+'px;--dy:'+(Math.sin(a)*r-50).toFixed(0)+'px;animation-delay:'+(i*16)+'ms';
    el.innerHTML=`<svg width="${z}" height="${z}" viewBox="0 0 24 24"><path d="M12 21s-8-4.9-8-10.5A4.5 4.5 0 0 1 12 7.2 4.5 4.5 0 0 1 20 10.5C20 16.1 12 21 12 21z" fill="${i%3?color:'#F08AAE'}"/></svg>`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),1500);
  }
}

$('btnSkip').addEventListener('click',()=>{
  if(!active)return;
  const d=active,k=todayKey();
  manual=null;
  S.skipped[k]=(S.skipped[k]||[]).concat([d.key]);save();render(true);
  if(!nextDose())setTimeout(playFinale,120);
  toast(d.med.name+' atlandı',()=>{
    S.skipped[k]=(S.skipped[k]||[]).filter(x=>x!==d.key);save();render(true);
  });
});

/* ---------------- bildirim ---------------- */
const notified={};
function bellState(){
  const ok=('Notification'in window)&&Notification.permission==='granted';
  $('bell').innerHTML=ok?ico.bellOn:ico.bellOff;
}
$('bell').addEventListener('click',()=>{
  if(!('Notification'in window)){toast('Bu tarayıcı bildirimi desteklemiyor');return}
  if(Notification.permission==='granted'){toast('Bildirimler açık');return}
  if(Notification.permission==='denied'){toast('Bildirim izni reddedilmiş, ayarlardan aç');return}
  Notification.requestPermission().then(p=>{
    bellState();
    toast(p==='granted'?'Bildirimler açıldı':'Bildirim izni verilmedi');
  });
});
function checkNotify(){
  if(!('Notification'in window)||Notification.permission!=='granted')return;
  const n=nowMin(),day=todayKey();
  doses().forEach(d=>{
    if(isDone(d.key))return;
    const k=day+'|'+d.key, diff=n-mins(d.time);
    if(!notified[k]&&diff>=0&&diff<=2){
      notified[k]=1;
      try{new Notification('İlaç zamanı',{body:d.med.name+' — '+d.time,tag:k});}catch(e){}
      if(navigator.vibrate)navigator.vibrate([20,60,20,60,20]);
      toast(d.med.name+' vakti geldi',()=>{
        setTimeout(()=>{delete notified[k]},10*60*1000);
        toast('10 dakika sonra yeniden hatırlatılacak');
      },'10 dk ertele');
    }
  });
}

$('scrim').addEventListener('click',hide);
let form={times:[],color:COLORS[0],shape:'capsule',days:[]},editing=null;

$('fName').addEventListener('input',drawForm);
$('fAddTime').addEventListener('click',()=>{

$('fSave').addEventListener('click',()=>{

const eatenKey=(id,i)=>id+'#'+i;
const isEaten=k=>(S.eaten[todayKey()]||[]).indexOf(k)>=0;
const mealList=()=>S.diet.slice().sort((a,b)=>mins(a.time)-mins(b.time));
function dietTotals(){
  let t=0,e=0;
  S.diet.forEach(m=>m.items.forEach((it,i)=>{t++;if(isEaten(eatenKey(m.id,i)))e++}));
  return [e,t];
}
const goal=()=>Math.min(16,Math.max(4,(S.settings&&S.settings.waterGoal)||8));
function waterCount(){return (S.water&&S.water[todayKey()])||0}
function renderWater(){
  const c=waterCount(),g=goal();let s='';
  for(let i=0;i<g;i++){
    const on=i<c;
    s+=`<button data-glass="${i}" aria-pressed="${on}" aria-label="${i+1}. bardak">
      <svg width="20" height="26" viewBox="0 0 20 26">
        <path d="M3 3h14l-1.6 20a2 2 0 0 1-2 1.8H6.6a2 2 0 0 1-2-1.8z"
          fill="${on?'#AFD6F0':'none'}" stroke="${on?'#AFD6F0':'rgba(90,44,70,.22)'}" stroke-width="1.6" stroke-linejoin="round"/>
      </svg></button>`;
  }
  $('water').innerHTML=s+`<span class="wl">${c} / ${g} bardak</span>`;
}
$('water').addEventListener('click',e=>{
  const b=e.target.closest('[data-glass]');if(!b)return;
  const i=parseInt(b.dataset.glass,10),k=todayKey();
  if(!S.water)S.water={};
  S.water[k]=(waterCount()===i+1)?i:i+1;
  save();renderWater();
  if(navigator.vibrate)navigator.vibrate(8);
});
function renderDiet(animate){
  const ms=mealList(),tot=dietTotals();
  $('dietCount').textContent=tot[1]?tot[0]+' / '+tot[1]:'';
  $('meals').innerHTML=ms.length?ms.map((m,mi)=>{
    const done=m.items.filter((it,i)=>isEaten(eatenKey(m.id,i))).length;
    return `<div class="meal" style="${animate?'animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) '+(mi*70+70)+'ms both':'animation:none'}">
      <h3>${esc(m.name)}<em>${m.time}</em><button data-meal="${m.id}" aria-label="Düzenle">${ico.pen}</button></h3>
      ${m.items.map((it,i)=>{
        const ok=isEaten(eatenKey(m.id,i));
        return `<div class="food${ok?' ok':''}"><button class="c" data-eat="${eatenKey(m.id,i)}" aria-pressed="${ok}" aria-label="${esc(it)}">${ok?ico.tick:''}</button><span>${esc(it)}</span></div>`;
      }).join('')}
      <div class="mbar"><i style="width:${m.items.length?(done/m.items.length*100).toFixed(0):0}%"></i></div>
    </div>`;
  }).join(''):'<div class="empty">Öğün eklemek için aşağıdaki artıya dokun</div>';
}
$('meals').addEventListener('click',e=>{
  const eat=e.target.closest('[data-eat]');
  if(eat){
    const k=todayKey(),key=eat.dataset.eat,list=S.eaten[k]||[];
    S.eaten[k]=isEaten(key)?list.filter(x=>x!==key):list.concat([key]);
    save();renderDiet(false);
    if(navigator.vibrate)navigator.vibrate(8);
    const t=dietTotals();
    if(t[1]&&t[0]===t[1])hearts(innerWidth/2,innerHeight*.42,'#8FD0B4');
    return;
  }
  const ed=e.target.closest('[data-meal]');
  if(ed){const m=S.diet.filter(x=>x.id===ed.dataset.meal)[0];if(m)openMeal(m)}
});

/* öğün formu */
let mealEdit=null;
function drawMeal(){
  $('mSave').textContent=mealEdit?'Güncelle':'Kaydet';
  $('mDel').style.display=mealEdit?'':'none';
  $('mSave').disabled=!($('mName').value.trim()&&$('mItems').value.trim());
}
function openMeal(m){
  mealEdit=m?m.id:null;
  $('mName').value=m?m.name:'';
  $('mTime').value=m?m.time:'08:00';
  $('mItems').value=m?m.items.join('\n'):'';
  drawMeal();show('sheetMeal');
}
$('mName').addEventListener('input',drawMeal);
$('mItems').addEventListener('input',drawMeal);
$('mSave').addEventListener('click',()=>{
  const items=$('mItems').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const data={name:$('mName').value.trim(),time:$('mTime').value||'08:00',items:items};
  if(mealEdit){
    const m=S.diet.filter(x=>x.id===mealEdit)[0];
    if(m){m.name=data.name;m.time=data.time;m.items=data.items}
  }else S.diet.push(Object.assign({id:'g'+Date.now()},data));
  mealEdit=null;save();hide();setTimeout(()=>renderDiet(true),300);
});
$('mDel').addEventListener('click',()=>{
  const id=mealEdit,m=S.diet.filter(x=>x.id===id)[0],idx=S.diet.indexOf(m);
  if(!m)return;
  S.diet=S.diet.filter(x=>x.id!==id);mealEdit=null;save();hide();
  setTimeout(()=>renderDiet(true),300);
  toast(m.name+' silindi',()=>{S.diet.splice(idx,0,m);save();renderDiet(true)});
});
$('btnAddMeal').addEventListener('click',()=>openMeal(null));

/* ---------------- ayarlar ---------------- */
let resetArmed=false;
$('btnSet').addEventListener('click',()=>{
  $('sWater').value=goal();
  $('sData').value='';
  resetArmed=false;$('sReset').textContent='Tüm verileri sil';
  show('sheetSet');
});
$('sWaterOk').addEventListener('click',()=>{
  const v=parseInt($('sWater').value,10);
  if(isNaN(v)){toast('Bir sayı gir');return}
  S.settings.waterGoal=Math.min(16,Math.max(4,v));
  $('sWater').value=S.settings.waterGoal;
  save();renderWater();toast('Hedef '+S.settings.waterGoal+' bardak');
});
$('sCopy').addEventListener('click',()=>{
  const txt=JSON.stringify(S);
  $('sData').value=txt;
  $('sData').select();
  let ok=false;
  try{ok=document.execCommand('copy')}catch(e){}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('Yedek panoya kopyalandı'),()=>toast(ok?'Yedek panoya kopyalandı':'Metni seçip elle kopyala'));
  }else toast(ok?'Yedek panoya kopyalandı':'Metni seçip elle kopyala');
});
$('sRestore').addEventListener('click',()=>{
  const raw=$('sData').value.trim();
  if(!raw){toast('Önce yedeği yapıştır');return}
  let p;
  try{p=JSON.parse(raw)}catch(e){toast('Yedek okunamadı');return}
  if(!p||!Array.isArray(p.meds)){toast('Bu bir yedek değil');return}
  const before=JSON.parse(JSON.stringify(S));
  S.meds=p.meds||[];S.taken=p.taken||{};S.skipped=p.skipped||{};
  S.diet=p.diet||[];S.eaten=p.eaten||{};S.water=p.water||{};
  S.settings=Object.assign({waterGoal:8},p.settings||{});
  save();hide();manual=null;render(true,true);renderWater();renderDiet(false);
  toast('Yedek geri yüklendi',()=>{
    Object.keys(before).forEach(k=>{S[k]=before[k]});
    save();render(true,true);renderWater();renderDiet(false);
  });
});
$('sReset').addEventListener('click',()=>{
  if(!resetArmed){resetArmed=true;$('sReset').textContent='Emin misin? Tekrar dokun';return}
  const before=JSON.parse(JSON.stringify(S));
  S.meds=[];S.taken={};S.skipped={};S.diet=[];S.eaten={};S.water={};
  save();hide();manual=null;render(true,true);renderWater();renderDiet(false);
  toast('Her şey silindi',()=>{
    Object.keys(before).forEach(k=>{S[k]=before[k]});
    save();render(true,true);renderWater();renderDiet(false);
  });
});

/* sekmeler */
let curTab='med';
function tab(which){
  if(which===curTab)return;
  const med=which==='med';
  const inEl=med?$('pgMed'):$('pgDiet'), outEl=med?$('pgDiet'):$('pgMed');
  const dir=med?-1:1;                       // diyete geçerken sağdan, geri dönerken soldan
  inEl.style.setProperty('--x',(dir*8)+'%');
  outEl.style.setProperty('--x',(-dir*8)+'%');
  outEl.classList.remove('on');
  inEl.classList.add('on');
  $('tabMed').classList.toggle('on',med);
  $('tabDiet').classList.toggle('on',!med);
  $('tabMed').setAttribute('aria-pressed',med);
  $('tabDiet').setAttribute('aria-pressed',!med);
  $('tabInd').style.transform=med?'none':'translateX(44px)';
  curTab=which;
  if(navigator.vibrate)navigator.vibrate(6);
  if(med){
    tween(scene.scale,1,520,x=>scene.scale=x);
    const el=$('water');el.style.animation='none';
    const f=$('foot');f.classList.remove('reveal-foot');void f.offsetWidth;f.classList.add('reveal-foot');
    const rs=document.querySelector('.ring svg');
    rs.style.animation='none';void rs.getBBox;rs.style.animation='fadeIn .5s ease .1s both';
  }else{
    tween(scene.scale,.02,420,x=>scene.scale=x);
    renderWater();renderDiet(true);
    const el=$('water');el.style.animation='none';void el.offsetWidth;
    el.style.animation='fadeUp .45s cubic-bezier(.2,.7,.3,1) both';
  }
}
$('tabMed').addEventListener('click',()=>tab('med'));
$('tabDiet').addEventListener('click',()=>tab('diet'));

/* paneli aşağı sürükleyerek kapat */
Array.prototype.forEach.call(document.querySelectorAll('.sheet'),s=>{
  let y0=null,dy=0;
  s.addEventListener('touchstart',e=>{
    if(s.scrollTop>0)return;
    y0=e.touches[0].clientY;dy=0;s.style.transition='none';
  },{passive:true});
  s.addEventListener('touchmove',e=>{
    if(y0===null)return;
    dy=e.touches[0].clientY-y0;
    if(dy>0)s.style.transform='translateY('+dy+'px)';
  },{passive:true});
  s.addEventListener('touchend',()=>{
    if(y0===null)return;
    s.style.transition='';s.style.transform='';
    if(dy>90)hide();
    y0=null;
  });
});

/* ana ekrana ekleme ipucu (iOS, tarayıcıdan açıldıysa) */
const ICON='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="116" fill="#FFEFF5"/><g transform="rotate(-38 256 256)"><rect x="196" y="120" width="120" height="272" rx="60" fill="#FFB3CD"/><path d="M196 256h120v76a60 60 0 0 1-120 0z" fill="rgba(0,0,0,.1)"/><rect x="224" y="158" width="26" height="74" rx="13" fill="#fff" opacity="0.6"/></g></svg>');
(function(){
  const l=document.createElement('link');l.rel='apple-touch-icon';l.href=ICON;document.head.appendChild(l);
  const man={name:'İlaç',short_name:'İlaç',display:'standalone',orientation:'portrait',
    background_color:'#FFEFF5',theme_color:'#FFEFF5',start_url:'.',
    icons:[{src:ICON,sizes:'512x512',type:'image/svg+xml',purpose:'any'}]};
  try{
    const url=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/json'}));
    const m=document.createElement('link');m.rel='manifest';m.href=url;document.head.appendChild(m);
  }catch(e){}
  const iOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
  const standalone=navigator.standalone||(matchMedia&&matchMedia('(display-mode: standalone)').matches);
  let seen=false;try{seen=!!localStorage.getItem('ilac.a2hs')}catch(e){}
  if(iOS&&!standalone&&!seen)setTimeout(()=>$('a2hs').classList.add('on'),3000);
  $('a2hsX').innerHTML=ico.x;
  $('a2hsX').addEventListener('click',()=>{
    $('a2hs').classList.remove('on');
    try{localStorage.setItem('ilac.a2hs','1')}catch(e){}
  });
})();

/* ---------------- başlat ---------------- */
$('btnAdd').innerHTML=ico.plusInk+'<span>İlaç ekle</span>';
$('btnList').innerHTML=ico.jar+'<span>İlaçlarım</span>';
$('btnSkip').innerHTML=ico.skip+'<span>Atla</span>';
$('btnAddMeal').innerHTML=ico.plus+'<span>Öğün ekle</span>';
$('tabMed').innerHTML=ico.pillTab;
$('tabDiet').innerHTML=ico.fork;
$('btnSet').innerHTML=ico.gear;
$('sWaterOk').innerHTML=ico.tickW;
renderWater();renderDiet(false);
$('fAddTime').innerHTML=ico.plus;
load();drawDial();bellState();
if(initGL())requestAnimationFrame(frame);
scene.scale=.12;
tickClock();render(false,false);
let booted=false;
function bootDone(){
  if(booted)return;booted=true;
  $('boot').classList.add('gone');
  playReveal(true);
  setTimeout(()=>{const b=$('boot');if(b)b.remove()},900);
}
const bootStart=performance.now();
const finishBoot=()=>setTimeout(bootDone,Math.max(0,540-(performance.now()-bootStart)));
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(finishBoot);setTimeout(finishBoot,1600)}
else finishBoot();
lastMin=new Date().getMinutes();
setInterval(()=>{
  tickClock();checkNotify();
  const d=new Date();
  if(keyOf(d)!==lastDay){lastDay=keyOf(d);manual=null}      // gece yarısı sıfırlama
  if(d.getMinutes()!==lastMin){lastMin=d.getMinutes();if(!openId)render()}
},1000);
const appEl=document.querySelector('.app');
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){appEl.classList.add('leaving')}
  else{appEl.classList.remove('leaving');tickClock();playReveal(false)}
});
addEventListener('pagehide',()=>appEl.classList.add('leaving'));
